name: Fetch BRO TV 3.3.8 Source
on:
  push:
    branches: [ qa/live-preload-no-apk ]
    paths: ['.github/workflows/fetch-brotv338-source.yml']

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download source from Firestorage
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='-E7xrFGiwJq-'
          TARGET='BROTV-3.3.8-dev37-source-r4.zip'
          CURL=(-4 --http1.1 -A 'BROTV-Source-Fetch/1.0' --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180)
          curl -fLss "${CURL[@]}" "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 -c "import json;d=json.load(open('/tmp/files.json'));fs=d.get('files',d if isinstance(d,list) else []);m=[x for x in fs if x.get('fileName')=='$TARGET' or x.get('name')=='$TARGET'];print((m[0].get('fileId') or m[0].get('id')) if m else '')")
          test -n "$FILE_ID"
          curl -fLss "${CURL[@]}" -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 -c "import json;d=json.load(open('/tmp/download.json'));print(d.get('downloadUrl') or d.get('download_url') or '')")
          test -n "$DOWNLOAD_URL"
          curl -fL "${CURL[@]}" "$DOWNLOAD_URL" -o /tmp/BROTV-3.3.8-dev37-source-r4.zip
          unzip -t /tmp/BROTV-3.3.8-dev37-source-r4.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.3.8-source-r4
          path: /tmp/BROTV-3.3.8-dev37-source-r4.zip
          if-no-files-found: error
