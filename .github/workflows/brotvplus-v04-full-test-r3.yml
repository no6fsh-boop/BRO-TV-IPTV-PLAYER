name: BRO PLUS TV brand verification R16

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brotvplus-v04-full-test-r3.yml'
      - '.github/assets/brotv-plus/**'
      - '.github/scripts/apply-brotv-plus-brand.sh'

jobs:
  brand-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib
          parts=sorted(glob.glob('.github/brotvplus-v04/part*.b64'))
          assert len(parts)==9, parts
          raw=base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts))
          digest=hashlib.sha256(raw).hexdigest()
          print('SOURCE_SHA256='+digest)
          assert digest=='a2a3cc0f3d0f59f697fd7508521746ca8e7d28ee34c73b230efa3a1066ff0488'
          pathlib.Path('/tmp/BROTV-v04.zip').write_bytes(raw)
          PY
          rm -rf /tmp/project && mkdir /tmp/project
          unzip -q /tmp/BROTV-v04.zip -d /tmp/project
          test -f /tmp/project/settings.gradle.kts
          echo 'PROJECT_DIR=/tmp/project' >> "$GITHUB_ENV"

      - name: Install branding and emulator dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick libpulse0 libgl1 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libdbus-1-3 libfontconfig1 libxkbcommon0 libxcb-cursor0

      - name: Apply BRO PLUS TV branding
        shell: bash
        run: |
          chmod +x .github/scripts/apply-brotv-plus-brand.sh
          .github/scripts/apply-brotv-plus-brand.sh | tee /tmp/brand-scan.txt
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/brotv_plus_logo.png"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/brotv_plus_icon.png"
          grep -q 'android:icon="@drawable/brotv_plus_icon"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:banner="@drawable/brotv_plus_banner"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:label="BRO PLUS TV"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests and branded APK build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/BRO-PLUS-TV-v04.apk
          find app/build/test-results/testDebugUnitTest -name '*.xml' -print -exec cat {} \; > /tmp/unit-tests.txt

      - name: Verify branded APK metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging /tmp/BRO-PLUS-TV-v04.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.brotv.iptv'" /tmp/apk-badging.txt
          grep -q "application-label:'BRO PLUS TV'" /tmp/apk-badging.txt
          grep -q "application: label='BRO PLUS TV' icon='res/drawable-nodpi-v4/brotv_plus_icon.png' banner='res/drawable-nodpi-v4/brotv_plus_banner.png'" /tmp/apk-badging.txt
          grep -q 'leanback-launchable-activity' /tmp/apk-badging.txt
          "$AAPT" dump xmltree /tmp/BRO-PLUS-TV-v04.apk AndroidManifest.xml | tee /tmp/manifest-tree.txt

      - name: Android TV visual brand test
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install emulator platform-tools 'platforms;android-30' 'system-images;android-30;android-tv;x86' >/dev/null
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          rm -rf "$ANDROID_AVD_HOME/brotv.avd" "$ANDROID_AVD_HOME/brotv.ini"
          echo no | "$AVDMANAGER" create avd --force -n brotv --package 'system-images;android-30;android-tv;x86' --device 'tv_1080p'
          printf 'hw.cpu.ncore=2\nhw.ramSize=2048\n' >> "$ANDROID_AVD_HOME/brotv.avd/config.ini"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          "$ADB" kill-server || true
          "$ADB" start-server
          "$EMULATOR" -port 5554 -avd brotv -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none -camera-front none >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          cleanup(){ "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0; consecutive=0
          for i in {1..300}; do
            state="$("$ADB" -s emulator-5554 get-state 2>/dev/null || true)"
            boot="$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            input="$("$ADB" -s emulator-5554 shell service check input 2>/dev/null || true)"
            if [ "$state" = device ] && [ "$boot" = 1 ] && echo "$input" | grep -q found; then consecutive=$((consecutive+1)); else consecutive=0; fi
            if [ "$consecutive" -ge 3 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          "$ADB" -s emulator-5554 install -r /tmp/BRO-PLUS-TV-v04.apk | tee /tmp/install.txt
          "$ADB" -s emulator-5554 shell input keyevent KEYCODE_HOME
          sleep 6
          "$ADB" -s emulator-5554 exec-out screencap -p > /tmp/00-outside-tv-home.png
          "$ADB" -s emulator-5554 shell monkey -p com.brotv.iptv -c android.intent.category.LEANBACK_LAUNCHER 1 | tee /tmp/launch.txt
          sleep 8
          ( "$ADB" -s emulator-5554 shell pidof com.brotv.iptv || true ) | tee /tmp/pid.txt
          "$ADB" -s emulator-5554 exec-out screencap -p > /tmp/01-inside-login.png || true
          "$ADB" -s emulator-5554 shell uiautomator dump /sdcard/ui.xml || true
          "$ADB" -s emulator-5554 pull /sdcard/ui.xml /tmp/01-inside-login.xml || true
          "$ADB" -s emulator-5554 logcat -d > /tmp/logcat.txt || true
          grep -nE 'FATAL EXCEPTION|AndroidRuntime|Resources\$NotFoundException|InflateException|ANR in com\.brotv\.iptv' /tmp/logcat.txt | tail -120 > /tmp/crash-evidence.txt || true
          test -s /tmp/pid.txt
          ! grep -E 'FATAL EXCEPTION|ANR in com\.brotv\.iptv' /tmp/logcat.txt

      - name: Brand verification report
        if: always()
        shell: bash
        run: |
          {
            echo '# BRO PLUS TV brand verification R16'
            echo '## APK metadata'; cat /tmp/apk-badging.txt 2>/dev/null || true
            echo '## Manifest branding'; grep -E 'BRO PLUS TV|android:(icon|banner)' /tmp/manifest-tree.txt 2>/dev/null || true
            echo '## Source branding'; cat /tmp/brand-scan.txt 2>/dev/null || true
            echo '## Install/launch'; cat /tmp/install.txt /tmp/launch.txt /tmp/pid.txt 2>/dev/null || true
            echo '## Crash evidence'; cat /tmp/crash-evidence.txt 2>/dev/null || true
          } > /tmp/BRO-PLUS-TV-BRAND-REPORT.md
          cat /tmp/BRO-PLUS-TV-BRAND-REPORT.md

      - name: Upload branded APK and visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRO-PLUS-TV-v04-R16
          path: |
            /tmp/BRO-PLUS-TV-v04.apk
            /tmp/BRO-PLUS-TV-BRAND-REPORT.md
            /tmp/BRO-PLUS-TV-icon.png
            /tmp/BRO-PLUS-TV-logo.png
            /tmp/00-outside-tv-home.png
            /tmp/01-inside-login.png
            /tmp/01-inside-login.xml
            /tmp/apk-badging.txt
            /tmp/manifest-tree.txt
            /tmp/brand-scan.txt
            /tmp/unit-tests.txt
            /tmp/logcat.txt
            /tmp/crash-evidence.txt
            /tmp/emulator.log
          if-no-files-found: ignore
          retention-days: 14
