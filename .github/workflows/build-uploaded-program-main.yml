name: Build uploaded BRO TV program one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uploaded-program-main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated uploaded-source branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-uploaded-program-20260911

      - name: Reconstruct project and apply smart-sources overlay
        shell: bash
        run: |
          cat .github/build-src/modified.b64.part* | base64 -d > /tmp/brotv.zip
          echo "e6a24fed4076e6eb58e0b305b55d0876534a8542f02e01283f73390096f647c6  /tmp/brotv.zip" | sha256sum -c -
          rm -rf /tmp/project && mkdir /tmp/project
          unzip -q /tmp/brotv.zip -d /tmp/project
          PROJECT_DIR="$(find /tmp/project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          sed -i 's/import androidx.compose.ui.CompositionLocalProvider/import androidx.compose.runtime.CompositionLocalProvider/' "$PROJECT_DIR/app/src/main/java/com/brotv/iptv/ui/screens/home/HomeScreen.kt"
          sed -i 's/fun setFocusedField(field: LoginField)/fun onFieldFocused(field: LoginField)/' "$PROJECT_DIR/app/src/main/java/com/brotv/iptv/ui/screens/login/LoginViewModel.kt"
          sed -i 's/viewModel\.setFocusedField(/viewModel.onFieldFocused(/g' "$PROJECT_DIR/app/src/main/java/com/brotv/iptv/ui/screens/login/LoginScreen.kt"
          echo '' | base64 -d | gzip -d > "$PROJECT_DIR/app/src/main/java/com/brotv/iptv/ui/screens/live/LiveTvScreen.kt"
          echo '' | base64 -d | gzip -d > "$PROJECT_DIR/app/src/main/java/com/brotv/iptv/data/remote/IptvRepository.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle :app:assembleDebug --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "========== COMPILE ERRORS =========="
            grep -E '(^e: |error:|Unresolved reference|Cannot find|Type mismatch|None of the following|Conflicting overloads|Expecting|Compilation error|Execution failed for task)' /tmp/build.log | tail -n 160 || true
            echo "========== END COMPILE ERRORS =========="
          fi
          exit "$STATUS"

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BRO-TV-UPLOADED-MODIFIED.apk
          sha256sum BRO-TV-UPLOADED-MODIFIED.apk > BRO-TV-UPLOADED-MODIFIED.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-uploaded-modified-apk
          path: |
            BRO-TV-UPLOADED-MODIFIED.apk
            BRO-TV-UPLOADED-MODIFIED.apk.sha256
          retention-days: 30
          if-no-files-found: error
