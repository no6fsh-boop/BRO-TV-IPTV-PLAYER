name: Build BROTV+ full fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uploaded-program-main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BROTV+ source branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-uploaded-program-20260911

      - name: Reconstruct BROTV+ project
        shell: bash
        run: |
          cat .github/build-src-plus/part* > /tmp/brotvplus.zip
          echo "a8d9b3103998755bcf95aca817e10f8b9342a786d60fe6214a93872fa16f2a5b  /tmp/brotvplus.zip" | sha256sum -c -
          rm -rf /tmp/project && mkdir /tmp/project
          unzip -q /tmp/brotvplus.zip -d /tmp/project
          PROJECT_DIR="$(find /tmp/project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle :app:assembleDebug --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "========== COMPILE ERRORS =========="
            grep -E '(^e: |error:|Unresolved reference|Cannot find|Type mismatch|None of the following|Conflicting overloads|Expecting|Compilation error|Execution failed for task)' /tmp/build.log | tail -n 220 || true
            echo "========== END COMPILE ERRORS =========="
          fi
          exit "$STATUS"

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BROTV-PLUS.apk
          sha256sum BROTV-PLUS.apk > BROTV-PLUS.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-plus-apk
          path: |
            BROTV-PLUS.apk
            BROTV-PLUS.apk.sha256
          retention-days: 30
          if-no-files-found: error

