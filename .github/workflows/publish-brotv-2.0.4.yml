name: Publish BRO TV 2.0.4 APK

on:
  push:
    branches: [ brotv-2.0.4-public-release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official signed APK
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='u4lnprm4axEk'
          FILE_ID='01a0a3e27945763b9ed9ebf5ee6110ad'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/BRO-TV-2.0.4.apk"
          echo 'ac1176e8a58e6e50fb4cb3aa9c6c2793a2967a44ae7decdbfdd361fbb1d87c91  '"$RUNNER_TEMP/BRO-TV-2.0.4.apk" | sha256sum -c -
          printf '%s  %s\n' 'ac1176e8a58e6e50fb4cb3aa9c6c2793a2967a44ae7decdbfdd361fbb1d87c91' 'BRO-TV-2.0.4.apk' > "$RUNNER_TEMP/BRO-TV-2.0.4-sha256.txt"

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view bro-tv-2.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload bro-tv-2.0.4 "$RUNNER_TEMP/BRO-TV-2.0.4.apk" "$RUNNER_TEMP/BRO-TV-2.0.4-sha256.txt" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create bro-tv-2.0.4 \
              "$RUNNER_TEMP/BRO-TV-2.0.4.apk#BRO-TV-2.0.4.apk" \
              "$RUNNER_TEMP/BRO-TV-2.0.4-sha256.txt#BRO-TV-2.0.4-sha256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'BRO TV 2.0.4 Field UX Batch' \
              --notes 'Field-test build implementing the requested live TV overlay and scoped channel navigation, channel hide/reorder behavior, stronger TV focus indicators, movie/series browsing redesign, and series details UX. APK SHA-256: ac1176e8a58e6e50fb4cb3aa9c6c2793a2967a44ae7decdbfdd361fbb1d87c91.'
          fi
