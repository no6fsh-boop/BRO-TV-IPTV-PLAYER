name: Publish BRO TV 2.0.0 APK

on:
  push:
    branches: [ brotv-2.0.0-public-release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official signed APK
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='0nwLKRb0OcUi'
          FILE_ID='01a0a380b426758484ec2369b34052dd'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/BRO-TV-2.0.0.apk"
          echo 'c43ee1b79b2902c029404952067ac01e1125e72813daac0e3946ef2b11ba5626  '"$RUNNER_TEMP/BRO-TV-2.0.0.apk" | sha256sum -c -
          printf '%s  %s\n' 'c43ee1b79b2902c029404952067ac01e1125e72813daac0e3946ef2b11ba5626' 'BRO-TV-2.0.0.apk' > "$RUNNER_TEMP/BRO-TV-2.0.0-sha256.txt"

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view bro-tv-2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload bro-tv-2.0.0 "$RUNNER_TEMP/BRO-TV-2.0.0.apk" "$RUNNER_TEMP/BRO-TV-2.0.0-sha256.txt" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create bro-tv-2.0.0 \
              "$RUNNER_TEMP/BRO-TV-2.0.0.apk#BRO-TV-2.0.0.apk" \
              "$RUNNER_TEMP/BRO-TV-2.0.0-sha256.txt#BRO-TV-2.0.0-sha256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'BRO TV 2.0.0' \
              --notes 'Official signed BRO TV 2.0.0 commercial Android TV release. APK SHA-256: c43ee1b79b2902c029404952067ac01e1125e72813daac0e3946ef2b11ba5626.'
          fi
