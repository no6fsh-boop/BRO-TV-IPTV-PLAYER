name: Publish BRO TV 2.0.3 APK

on:
  push:
    branches: [ brotv-2.0.3-public-release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official signed APK
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='HueNV0weztzN'
          FILE_ID='01a0a3b9ad70713786fdcccffe0ce342'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/BRO-TV-2.0.3.apk"
          echo '1d782d30205cdcb6e71f5251dd34dc54105d7d339d735078a5adc361f1f51078  '"$RUNNER_TEMP/BRO-TV-2.0.3.apk" | sha256sum -c -
          printf '%s  %s\n' '1d782d30205cdcb6e71f5251dd34dc54105d7d339d735078a5adc361f1f51078' 'BRO-TV-2.0.3.apk' > "$RUNNER_TEMP/BRO-TV-2.0.3-sha256.txt"

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view bro-tv-2.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload bro-tv-2.0.3 "$RUNNER_TEMP/BRO-TV-2.0.3.apk" "$RUNNER_TEMP/BRO-TV-2.0.3-sha256.txt" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create bro-tv-2.0.3 \
              "$RUNNER_TEMP/BRO-TV-2.0.3.apk#BRO-TV-2.0.3.apk" \
              "$RUNNER_TEMP/BRO-TV-2.0.3-sha256.txt#BRO-TV-2.0.3-sha256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'BRO TV 2.0.3 Live TV UX Hotfix' \
              --notes 'Field hotfix: removes VOD seek controls from live TV, auto-hides live controls, adds TV Guide/current channel/quality-source controls, and locks DPAD channel surfing to the opened folder in provider order. APK SHA-256: 1d782d30205cdcb6e71f5251dd34dc54105d7d339d735078a5adc361f1f51078.'
          fi
