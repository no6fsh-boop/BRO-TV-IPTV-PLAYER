name: Validate BROTV Lint Fixes

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: lH1GaJ2UEgv2
      FILE_ID: 01a09d59f3a07047a31f2ec75adcc643
      EXPECTED_SIZE: '3620293'
      EXPECTED_SHA256: 0cbba2fc547bae36fa5d4623ecfe45990a8471b8f412de152a48affbec8c3615
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact fixed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-validate && mkdir -p /tmp/brotv-validate && cd /tmp/brotv-validate
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Verify wrapper and project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --version
      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Run Android Lint
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon :app:lintDebug
          status=$?
          echo "LINT_EXIT=$status" >> "$GITHUB_ENV"
          mkdir -p /tmp/lint-output
          find app/build -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results-debug.html' -o -name 'lint-results-debug.xml' \) -exec cp {} /tmp/lint-output/ \;
          exit 0
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-LintFix-v1-Report
          path: /tmp/lint-output/
          retention-days: 2
      - name: Enforce lint clean
        shell: bash
        run: |
          test "$LINT_EXIT" = "0"
