name: Verify BROTV Signed Release APK

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  verify-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: mTGZRIjMueek
      FILE_ID: 01a09d7fac7f717cad58f60593e0e1a4
      EXPECTED_SIZE: '10565009'
      EXPECTED_SHA256: 3989e087aebbb72e0df4d09b1feafa297412fc27ce85beb5f1923dc04dc09adc
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;34.0.0" "platform-tools"
      - name: Download exact signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-signed && mkdir -p /tmp/brotv-signed && cd /tmp/brotv-signed
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','input.apk'],check=True)
          PY
          test "$(stat -c%s input.apk)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  input.apk" | sha256sum -c -
      - name: Verify and align signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/brotv-signed
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if "$BT/zipalign" -c -p 4 input.apk; then
            cp input.apk BROTV-Release-Signed.apk
          else
            "$BT/zipalign" -p -f 4 input.apk BROTV-Release-Signed.apk
            "$BT/zipalign" -c -p 4 BROTV-Release-Signed.apk
          fi
          "$BT/apksigner" verify --verbose --print-certs BROTV-Release-Signed.apk | tee apksigner.txt
          jarsigner -verify -verbose -certs BROTV-Release-Signed.apk > jarsigner.txt
          "$BT/aapt" dump badging BROTV-Release-Signed.apk | tee badging.txt
          grep -q "package: name='com.example.iptvplayer' versionCode='1' versionName='1.0'" badging.txt
          grep -q "application-label:'BRO TV'" badging.txt
          sha256sum BROTV-Release-Signed.apk | tee BROTV-Release-Signed.sha256
      - name: Upload verified signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Verified-Signed-Release
          path: |
            /tmp/brotv-signed/BROTV-Release-Signed.apk
            /tmp/brotv-signed/BROTV-Release-Signed.sha256
            /tmp/brotv-signed/apksigner.txt
            /tmp/brotv-signed/jarsigner.txt
            /tmp/brotv-signed/badging.txt
          retention-days: 3
