name: Final Verify BROTV Signed Release

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: 5PxVyjo19qz8
      FILE_ID: 01a09d83fbbb73dfad5d254e9de780e0
      EXPECTED_SIZE: '10567951'
      EXPECTED_SHA256: 5855175662cbd10e720c7e343844f0a2724226913f763e40bf18c03384efde4d
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;34.0.0" "platform-tools"
      - name: Download exact final Release APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-final && mkdir -p /tmp/brotv-final && cd /tmp/brotv-final
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','BROTV-Release-v1.0-Signed.apk'],check=True)
          PY
          test "$(stat -c%s BROTV-Release-v1.0-Signed.apk)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  BROTV-Release-v1.0-Signed.apk" | sha256sum -c -
      - name: Official Android verification
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/brotv-final
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK="BROTV-Release-v1.0-Signed.apk"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apksigner.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.example.iptvplayer' versionCode='1' versionName='1.0'" badging.txt
          grep -q "application-label:'BRO TV'" badging.txt
          sha256sum "$APK" | tee BROTV-Release-v1.0-Signed.sha256
      - name: Upload final verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Final-Verified-Release
          path: |
            /tmp/brotv-final/BROTV-Release-v1.0-Signed.apk
            /tmp/brotv-final/BROTV-Release-v1.0-Signed.sha256
            /tmp/brotv-final/apksigner.txt
            /tmp/brotv-final/badging.txt
          retention-days: 3
