name: Build Validated BROTV Debug APK

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: R4zbtpx6zcuQ
      FILE_ID: 01a09d5e294375a0bcd012efbd0112e7
      EXPECTED_SIZE: '3622809'
      EXPECTED_SHA256: 74b26cb9a6c28841114c85a3a8fb0b9422aaa41b75e0f143a5f78c7f89d8f0ee
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-debug && mkdir -p /tmp/brotv-debug && cd /tmp/brotv-debug
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --version
      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.example.iptvplayer'" /tmp/badging.txt
          mkdir -p /tmp/brotv-output
          cp "$APK" /tmp/brotv-output/BROTV-Validated-Debug.apk
          sha256sum "$APK" | tee /tmp/brotv-output/BROTV-Validated-Debug.sha256
          cp /tmp/apksigner.txt /tmp/brotv-output/apksigner.txt
          cp /tmp/badging.txt /tmp/brotv-output/badging.txt
      - name: Upload validated Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Validated-Debug
          path: /tmp/brotv-output/
          retention-days: 3
