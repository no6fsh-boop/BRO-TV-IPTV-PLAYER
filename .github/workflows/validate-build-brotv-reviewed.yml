name: Export Android Signing Tools

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;34.0.0"
      - name: Prepare local signing tool bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$SRC/apksigner"
          test -f "$SRC/lib/apksigner.jar"
          test -x "$SRC/zipalign"
          rm -rf /tmp/android-sign-tools && mkdir -p /tmp/android-sign-tools/lib
          cp "$SRC/apksigner" /tmp/android-sign-tools/
          cp "$SRC/zipalign" /tmp/android-sign-tools/
          cp "$SRC/aapt" /tmp/android-sign-tools/
          cp "$SRC/lib/apksigner.jar" /tmp/android-sign-tools/lib/
          cp "$SRC/source.properties" /tmp/android-sign-tools/
          chmod +x /tmp/android-sign-tools/apksigner /tmp/android-sign-tools/zipalign /tmp/android-sign-tools/aapt
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-34-Signing
          path: /tmp/android-sign-tools/
          retention-days: 1
