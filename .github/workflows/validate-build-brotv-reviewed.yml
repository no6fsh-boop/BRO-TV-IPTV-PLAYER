name: Collect BROTV Lint Report

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  lint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: 7mSnMcBAzZZI
      FILE_ID: 01a09d4d608170298a51df1b8e3194e7
      EXPECTED_SIZE: '3619025'
      EXPECTED_SHA256: 1f08fa4150da8df58ad1e22c56a1870f082fb21ece6ba896db87fcb537f70cc6
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-lint && mkdir -p /tmp/brotv-lint && cd /tmp/brotv-lint
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Run lint and preserve full report
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintDebug
          echo "LINT_EXIT=$?" >> "$GITHUB_ENV"
          mkdir -p /tmp/lint-output
          find app/build -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results-debug.html' -o -name 'lint-results-debug.xml' \) -exec cp {} /tmp/lint-output/ \;
          ls -l /tmp/lint-output
          exit 0
      - name: Upload full lint report
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Full-Lint-Report
          path: /tmp/lint-output/
          retention-days: 2
      - name: Mark lint result
        shell: bash
        run: |
          echo "Original lint exit code: $LINT_EXIT"
