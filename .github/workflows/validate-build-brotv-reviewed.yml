name: Validate BROTV Release Variant

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: cw4EtSveO3bX
      FILE_ID: 01a09d72bb0c767fb66129623b7297d6
      EXPECTED_SIZE: '3608309'
      EXPECTED_SHA256: 1fcb50d1fed4c1109fe7879f4efecde0b555efadd94eb207a15ea7d0d27c4663
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-release && mkdir -p /tmp/brotv-release && cd /tmp/brotv-release
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "1.0"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --version
      - name: Release unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest
      - name: Release lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:lintRelease
      - name: Assemble unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify Release APK structure
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" | tee /tmp/zipalign.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/release-badging.txt
          grep -q "package: name='com.example.iptvplayer'" /tmp/release-badging.txt
          grep -q "versionCode='1'" /tmp/release-badging.txt
          grep -q "versionName='1.0'" /tmp/release-badging.txt
          mkdir -p /tmp/brotv-release-output
          cp "$APK" /tmp/brotv-release-output/BROTV-Release-Unsigned.apk
          sha256sum "$APK" | tee /tmp/brotv-release-output/BROTV-Release-Unsigned.sha256
          cp /tmp/zipalign.txt /tmp/brotv-release-output/zipalign.txt
          cp /tmp/release-badging.txt /tmp/brotv-release-output/badging.txt
      - name: Upload Release validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Release-Validation
          path: /tmp/brotv-release-output/
          retention-days: 3
