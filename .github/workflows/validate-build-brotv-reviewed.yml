name: Smoke Test BROTV APK

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: cw4EtSveO3bX
      FILE_ID: 01a09d72bb0c767fb66129623b7297d6
      EXPECTED_SIZE: '3608309'
      EXPECTED_SHA256: 1fcb50d1fed4c1109fe7879f4efecde0b555efadd94eb207a15ea7d0d27c4663
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-smoke && mkdir -p /tmp/brotv-smoke && cd /tmp/brotv-smoke
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build exact Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot emulator, install and launch BRO TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd "$PROJECT_DIR"
            APK="app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.example.iptvplayer
            adb shell am start -W -n com.example.iptvplayer/.MainActivity | tee /tmp/am-start.txt
            sleep 8
            PID="$(adb shell pidof com.example.iptvplayer | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities > /tmp/activities.txt
            grep -q 'com.example.iptvplayer' /tmp/activities.txt
            adb logcat -d -t 4000 > /tmp/brotv-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.example\.iptvplayer.*has died' /tmp/brotv-logcat.txt; then
              echo 'BRO TV crashed during startup smoke test' >&2
              exit 1
            fi
            mkdir -p /tmp/brotv-smoke-output
            cp /tmp/am-start.txt /tmp/brotv-smoke-output/
            cp /tmp/activities.txt /tmp/brotv-smoke-output/
            cp /tmp/brotv-logcat.txt /tmp/brotv-smoke-output/
            printf 'Smoke test PASS\nPackage: com.example.iptvplayer\nAPI: 30\nPID: %s\n' "$PID" > /tmp/brotv-smoke-output/result.txt
      - name: Upload smoke-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Smoke-Test
          path: /tmp/brotv-smoke-output/
          retention-days: 3
