name: Validate BROTV Final Candidate

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-build-brotv-reviewed.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: R4zbtpx6zcuQ
      FILE_ID: 01a09d5e294375a0bcd012efbd0112e7
      EXPECTED_SIZE: '3622809'
      EXPECTED_SHA256: 74b26cb9a6c28841114c85a3a8fb0b9422aaa41b75e0f143a5f78c7f89d8f0ee
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-final && mkdir -p /tmp/brotv-final && cd /tmp/brotv-final
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text()); url=d.get('downloadUrl')
          if not url: print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          test -f app/src/test/java/com/example/iptvplayer/data/StreamHealthScorerTest.kt
          test -f app/src/test/java/com/example/iptvplayer/player/DynamicBufferControllerTest.kt
          chmod +x gradlew
          ./gradlew --version
      - name: Compile Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Android Lint
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:lintDebug
