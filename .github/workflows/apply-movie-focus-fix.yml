name: Apply movie player focus fix

on:
  push:
    branches: [ ui/reference-home-redesign ]
    paths: [ '.github/workflows/apply-movie-focus-fix.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/reference-home-redesign
      - name: Patch movie fullscreen focus
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/brotv/iptv/ui/screens/library/MediaLibraryScreen.kt')
          s = p.read_text()

          # Remove the old overlay-style fullscreen block near the end of
          # MediaLibraryScreen. This leaves the underlying library focusable,
          # which can steal DPAD_CENTER from the movie player.
          pattern = re.compile(
              r'\n    if \(fullscreenMovie && selectedMovie != null\) \{.*?\n    \}\n\}\n\n@Composable\nprivate fun PosterCard',
              re.S,
          )
          replacement = '\n}\n\n@Composable\nprivate fun PosterCard'
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'fullscreen overlay block matches: {count}')

          # Render fullscreen playback before the library UI so the library is
          # removed from the focus tree while a movie is playing.
          marker = '    Column(Modifier.fillMaxSize().background(BroTvColors.BackgroundNight)) {'
          if marker not in s:
              raise SystemExit('library column marker not found')
          early = '''    if (fullscreenMovie && selectedMovie != null) {
              val movie = selectedMovie!!
              FullPlayer(
                  player = player,
                  title = movie.name,
                  seekSeconds = preferences.seekSeconds,
                  onFavorite = { preferences.toggleFavoriteMovie(movie.id); favoriteVersion++ },
                  onClose = {
                      preferences.saveMovieProgress(movie.id, player.currentPosition, player.duration)
                      player.pause(); fullscreenMovie = false
                      if (mode == LibraryMode.CONTINUE) loadSpecial(LibraryMode.CONTINUE)
                  },
              )
              return
          }

          '''
          s = s.replace(marker, early + marker, 1)

          old_focus = '    LaunchedEffect(Unit) { kotlinx.coroutines.delay(60); runCatching { playerFocusRequester.requestFocus() } }'
          new_focus = '''    LaunchedEffect(Unit) {
              repeat(3) { attempt ->
                  kotlinx.coroutines.delay(if (attempt == 0) 60 else 140)
                  runCatching { playerFocusRequester.requestFocus() }
              }
          }'''
          if old_focus not in s:
              raise SystemExit('player focus marker not found')
          s = s.replace(old_focus, new_focus, 1)

          old_center = 'KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { if (player.isPlaying) player.pause() else player.play(); true }'
          new_center = 'KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { if (player.isPlaying) player.pause() else player.play(); true }'
          if old_center not in s:
              raise SystemExit('center-key handler not found')
          s = s.replace(old_center, new_center, 1)

          p.write_text(s)
          PY
          git config user.name "BRO TV QA Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/brotv/iptv/ui/screens/library/MediaLibraryScreen.kt
          git commit -m "Fix fullscreen movie remote focus"
          git push origin HEAD:ui/reference-home-redesign
