name: Publish BRO TV 2.0.6 APK

on:
  push:
    branches: [ brotv-2.0.6-public-release ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed APK
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='eHKz-rfs5RjO'
          FILE_ID='01a0aa640518768d9c98b1e58c708936'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o BRO-TV-2.0.6.apk
          echo 'd412b52eed7a25d4f8feb245247dab464d2ba7364025888d5f8b37ae62d46a18  BRO-TV-2.0.6.apk' | sha256sum -c -
          sha256sum BRO-TV-2.0.6.apk > BRO-TV-2.0.6-sha256.txt

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create bro-tv-2.0.6 \
            BRO-TV-2.0.6.apk#BRO-TV-2.0.6.apk \
            BRO-TV-2.0.6-sha256.txt#BRO-TV-2.0.6-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'BRO TV 2.0.6 Live Fallback Fix' \
            --notes 'Fixes live channels going fully offline after 2.0.5 by allowing one same-source retry and at most one automatic alternative source per channel session. A second failure stops recovery and leaves manual source selection in control. Pending recovery is cancelled when changing channels. APK SHA-256: d412b52eed7a25d4f8feb245247dab464d2ba7364025888d5f8b37ae62d46a18.'
