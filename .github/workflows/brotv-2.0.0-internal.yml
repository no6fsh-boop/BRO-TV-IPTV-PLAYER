name: BRO TV 2.0.0 Internal Verification

on:
  push:
    branches: [brotv-2.0.0-internal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified source
        run: |
          curl -fL 'https://firestorage.ai/api/files/01a0a20f20807397a12a8ccd87721d93/download' -o source.zip || curl -fL 'https://firestorage.ai/ja/f/CF4LG5ozmfBq' -o source.zip
          unzip -q source.zip -d src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-34"
      - name: Verify source version
        working-directory: src
        run: grep -R 'versionName = "2.0.0"' app/build.gradle.kts
      - name: Run unit tests
        working-directory: src
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: src
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: unzip -t src/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-2.0.0-INTERNAL
          path: src/app/build/outputs/apk/debug/app-debug.apk
