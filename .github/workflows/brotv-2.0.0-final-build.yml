name: BRO TV 2.0.0 RC4 Final Commercial Gate

on:
  push:
    branches: [ brotv-2.0.0-rc4-final ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified RC4 source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='QZ2I-epdgoB_'
          FILE_ID='01a0a350c31575d1b1bccd7cf9d4b9a3'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/source.zip"
          echo '25ebb46252a0a87bb7fe012cc16cd4c4ebb6794e32bb0be00b41a0057f4fa1be  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$GITHUB_WORKSPACE/project"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify final commercial source baseline
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'namespace = "com.brotv.player"' app/build.gradle.kts
          grep -n 'applicationId = "com.brotv.player"' app/build.gradle.kts
          grep -n 'versionCode = 20' app/build.gradle.kts
          grep -n 'versionName = "2.0.0"' app/build.gradle.kts
          ! grep -R 'com.example.iptvplayer' app/src/main app/src/test app/build.gradle.kts
          ! grep -R 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          ! grep -R 'Log\.[divew](' app/src/main/java
          grep -n 'checkpoint restores implicit byte range after live playlist window slides' app/src/test/java/com/example/iptvplayer/dvr/DvrStreamRecorderTest.kt
          grep -n 'SecureRandom' app/src/main/java/com/example/iptvplayer/data/PairingTokenGenerator.kt
          grep -n 'recoveryHandler' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'XmltvTransportPolicy.isGzip' app/src/main/java/com/example/iptvplayer/data/XmltvEpgRepository.kt

      - name: Run all unit tests
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Android release lint gate
        working-directory: project
        run: ./gradlew --no-daemon lintRelease

      - name: Build commercial release candidates
        working-directory: project
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Prepare final offline-signing package
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/final-build"
          mkdir -p "$OUT"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BUILD_TOOLS/zipalign"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$OUT/BRO-TV-2.0.0-aligned-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -c 4 "$OUT/BRO-TV-2.0.0-aligned-unsigned.apk"
          cp "$AAB" "$OUT/BRO-TV-2.0.0-unsigned.aab"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$RUNNER_TEMP/source.zip" "$OUT/BRO-TV-2.0.0-source.zip"
          if [ -f app/build/reports/lint-results-release.txt ]; then cp app/build/reports/lint-results-release.txt "$OUT/"; fi
          sha256sum "$OUT"/* | tee "$OUT/unsigned-sha256.txt"
          unzip -t "$OUT/BRO-TV-2.0.0-aligned-unsigned.apk" >/dev/null
          unzip -t "$OUT/BRO-TV-2.0.0-unsigned.aab" >/dev/null
          unzip -t "$OUT/BRO-TV-2.0.0-source.zip" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-2.0.0-FINAL-CANDIDATE
          path: final-build/
          retention-days: 7
