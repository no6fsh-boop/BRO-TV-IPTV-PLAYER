name: BRO TV 2.0.2 Live Field Hotfix Gate

on:
  push:
    branches: [ brotv-2.0.2-live-hotfix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified 2.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='8GKnQIve6-h1'
          FILE_ID='01a0a398b6877198af94779a6ecca260'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/source.zip"
          echo '1a3304222641b04a7d9fa41bad371bea5e2876e88c350f5649f95b2c79eb582e  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$GITHUB_WORKSPACE/project"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify field hotfix identity and recovery guardrails
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'namespace = "com.brotv.player"' app/build.gradle.kts
          grep -n 'applicationId = "com.brotv.player"' app/build.gradle.kts
          grep -n 'versionCode = 22' app/build.gradle.kts
          grep -n 'versionName = "2.0.2"' app/build.gradle.kts
          grep -n 'KEYCODE_DPAD_UP' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'KEYCODE_DPAD_DOWN' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'if (isLiveContent) return' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'hasReceivedFirstVideoFrame = true' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'LivePlaybackRecoveryPolicy' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'five seconds after first video frame never triggers black screen recovery' app/src/test/java/com/example/iptvplayer/player/LivePlaybackRecoveryPolicyTest.kt
          ! grep -R 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          ! grep -R 'Log\.[divew](' app/src/main/java

      - name: Run all unit tests
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Android release lint gate
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintRelease
          REPORT='app/build/reports/lint-results-release.txt'
          test -s "$REPORT"
          for ID in WakelockTimeout HardcodedText TextFields Autofill CutPasteId SetTextI18n ContentDescription; do
            if grep -Fq "[$ID]" "$REPORT"; then
              echo "Blocked lint warning remains: $ID" >&2
              grep -F "[$ID]" "$REPORT" >&2 || true
              exit 1
            fi
          done

      - name: Build release APK and AAB
        working-directory: project
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Prepare offline-signing package
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/final-build"
          mkdir -p "$OUT"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$OUT/BRO-TV-2.0.2-aligned-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -c 4 "$OUT/BRO-TV-2.0.2-aligned-unsigned.apk"
          cp "$AAB" "$OUT/BRO-TV-2.0.2-unsigned.aab"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$RUNNER_TEMP/source.zip" "$OUT/BRO-TV-2.0.2-source.zip"
          cp app/build/reports/lint-results-release.txt "$OUT/"
          sha256sum "$OUT"/* > "$OUT/unsigned-sha256.txt"
          unzip -t "$OUT/BRO-TV-2.0.2-aligned-unsigned.apk" >/dev/null
          unzip -t "$OUT/BRO-TV-2.0.2-unsigned.aab" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-2.0.2-LIVE-HOTFIX
          path: final-build/
          retention-days: 7
