name: BRO TV 2.0.4 Field UX Batch Gate

on:
  push:
    branches: [ brotv-2.0.4-field-batch ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified 2.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='q5bgR85-5XxO'
          FILE_ID='01a0a3dae26c73a18fffb027ce10fdf5'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/source.zip"
          echo '15d8904bbc1d96662037aadde093b218d82470732d3b876889ed206b69a36eb1  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$GITHUB_WORKSPACE/project"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 2.0.4 field UX requirements
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'namespace = "com.brotv.player"' app/build.gradle.kts
          grep -n 'applicationId = "com.brotv.player"' app/build.gradle.kts
          grep -n 'versionCode = 24' app/build.gradle.kts
          grep -n 'versionName = "2.0.4"' app/build.gradle.kts
          grep -n 'EXTRA_RETURN_CHANNEL' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'openGuide()' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -n 'fullPlayerLauncher' app/src/main/java/com/example/iptvplayer/ui/ChannelBrowseActivity.kt
          grep -n 'hideChannel(hiddenChannel.id)' app/src/main/java/com/example/iptvplayer/ui/ChannelBrowseActivity.kt
          grep -n 'liveCategoryOrder' app/src/main/java/com/example/iptvplayer/ui/ChannelReorderActivity.kt
          grep -n 'movingPosition' app/src/main/java/com/example/iptvplayer/ui/ChannelReorderAdapter.kt
          grep -n 'providerCategoryOrder' app/src/main/java/com/example/iptvplayer/data/XtreamClient.kt
          grep -n 'btnContinueWatching' app/src/main/res/layout/activity_movies.xml
          grep -n 'btnContinueWatching' app/src/main/res/layout/activity_series.xml
          grep -n 'recyclerSeasons' app/src/main/res/layout/activity_series_detail.xml
          grep -n 'enableTvListFocus' app/src/main/java/com/example/iptvplayer/ui/TvDialogFocus.kt
          ! grep -R 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          ! grep -R 'Log\.[divew](' app/src/main/java

      - name: Run all unit tests
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Android release lint gate
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintRelease
          REPORT='app/build/reports/lint-results-release.txt'
          test -s "$REPORT"
          for ID in WakelockTimeout HardcodedText TextFields Autofill CutPasteId SetTextI18n ContentDescription; do
            if grep -Fq "[$ID]" "$REPORT"; then
              echo "Blocked lint warning remains: $ID" >&2
              grep -F "[$ID]" "$REPORT" >&2 || true
              exit 1
            fi
          done

      - name: Build release APK and AAB
        working-directory: project
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Prepare offline-signing package
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/final-build"
          mkdir -p "$OUT"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$OUT/BRO-TV-2.0.4-aligned-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -c 4 "$OUT/BRO-TV-2.0.4-aligned-unsigned.apk"
          cp "$AAB" "$OUT/BRO-TV-2.0.4-unsigned.aab"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$RUNNER_TEMP/source.zip" "$OUT/BRO-TV-2.0.4-source.zip"
          cp app/build/reports/lint-results-release.txt "$OUT/"
          sha256sum "$OUT"/* > "$OUT/unsigned-sha256.txt"
          unzip -t "$OUT/BRO-TV-2.0.4-aligned-unsigned.apk" >/dev/null
          unzip -t "$OUT/BRO-TV-2.0.4-unsigned.aab" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-2.0.4-FIELD-UX-BATCH
          path: final-build/
          retention-days: 7
