name: BRO PLUS TV redesign final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brotvplus-redesign-final.yml'
      - '.github/scripts/apply-brotv-plus-redesign.sh'
      - '.github/scripts/apply-brotv-plus-brand.sh'
      - '.github/redesign/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib
          parts=sorted(glob.glob('.github/brotvplus-v04/part*.b64'))
          assert len(parts)==9, parts
          raw=base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts))
          digest=hashlib.sha256(raw).hexdigest()
          print('SOURCE_SHA256='+digest)
          assert digest=='a2a3cc0f3d0f59f697fd7508521746ca8e7d28ee34c73b230efa3a1066ff0488'
          pathlib.Path('/tmp/BROTV-v04.zip').write_bytes(raw)
          PY
          rm -rf /tmp/project && mkdir /tmp/project
          unzip -q /tmp/BROTV-v04.zip -d /tmp/project
          echo 'PROJECT_DIR=/tmp/project' >> "$GITHUB_ENV"

      - name: Apply all approved fixes
        shell: bash
        run: |
          chmod +x .github/scripts/apply-brotv-plus-redesign.sh
          .github/scripts/apply-brotv-plus-redesign.sh

      - name: Install branding dependency
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick

      - name: Apply BRO PLUS TV branding
        shell: bash
        run: |
          chmod +x .github/scripts/apply-brotv-plus-brand.sh
          .github/scripts/apply-brotv-plus-brand.sh

      - name: Verify requested feature contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -R -q 'enum class LoginMode' app/src/main/java/com/brotv/iptv
          grep -R -q 'إرسال إلى الشاشة وتسجيل الدخول' app/src/main/java/com/brotv/iptv
          grep -R -q '5 دقائق' app/src/main/java/com/brotv/iptv
          grep -R -q 'الجودة' app/src/main/java/com/brotv/iptv/ui
          grep -R -q 'RATIO_16_9' app/src/main/java/com/brotv/iptv/ui
          grep -R -q 'KEYCODE_BACK.*onDismiss' app/src/main/java/com/brotv/iptv/ui/screens/live/LiveTvScreen.kt
          grep -R -q 'fullscreenFocusRequester' app/src/main/java/com/brotv/iptv/ui/screens/live/LiveTvScreen.kt
          grep -R -q 'listMemoryCache' app/src/main/java/com/brotv/iptv/data/remote/IptvRepository.kt
          grep -R -q 'forceRefresh' app/src/main/java/com/brotv/iptv/data/remote/IptvRepository.kt
          grep -R -q 'retryOnConnectionFailure(true)' app/src/main/java/com/brotv/iptv/BroTvApplication.kt
          grep -R -q 'compactLibraryLayout' app/src/main/java/com/brotv/iptv/ui/screens/library/MediaLibraryScreen.kt
          grep -R -q 'إخفاء فئات القنوات المباشرة' app/src/main/java/com/brotv/iptv/ui/screens/settings/SettingsScreen.kt
          grep -R -q 'getSubscriptionDaysLeft' app/src/main/java/com/brotv/iptv
          ! grep -R -q 'PLACEHOLDER background' app/src/main/res/drawable/bg_login_night.xml
          ! grep -R -q 'R.drawable.brotv_logo_gold\|@drawable/brotv_logo_gold' app/src/main || exit 1
          python3 - <<'PY'
          from pathlib import Path
          home=Path('app/src/main/java/com/brotv/iptv/ui/screens/home/HomeScreen.kt').read_text()
          labels=['المفضلة','القنوات','الأفلام','المسلسلات','التحديث']
          pos=[home.index(x) for x in labels]
          assert pos==sorted(pos), (labels,pos)
          settings=Path('app/src/main/java/com/brotv/iptv/ui/screens/settings/SettingsScreen.kt').read_text()
          required=['تغيير اللغة','تعطيل الرقابة الأبوية','الرقابة الأبوية','إخفاء فئات المسلسلات','إخفاء فئات الفيديو عند الطلب','إخفاء فئات القنوات المباشرة','تنسيق الوقت','تنسيق البث المباشر','تغيير التخطيط','مسح تاريخ المسلسلات','مسح تاريخ الأفلام','مسح قنوات السجل']
          for item in required: assert item in settings, item
          assert len(required)==12
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit test and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/BRO-PLUS-TV-FINAL.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging /tmp/BRO-PLUS-TV-FINAL.apk | tee /tmp/aapt.txt
          grep -q "application-label:'BRO PLUS TV'" /tmp/aapt.txt
          sha256sum /tmp/BRO-PLUS-TV-FINAL.apk | tee /tmp/apk-sha256.txt
          identify /tmp/BRO-PLUS-TV-logo.png /tmp/BRO-PLUS-TV-icon.png /tmp/BRO-PLUS-TV-banner.png | tee /tmp/branding.txt
          {
            echo '# BRO PLUS TV build verification'
            echo
            echo 'Unit tests: PASS'
            echo 'APK build: PASS'
            echo 'Requested static contract: PASS'
            echo 'Brand label: BRO PLUS TV'
            echo
            cat /tmp/apk-sha256.txt
            echo
            cat /tmp/branding.txt
          } > /tmp/BUILD-VERIFICATION.txt

      - name: Upload build candidate
        uses: actions/upload-artifact@v4
        with:
          name: BRO-PLUS-TV-BUILD
          path: |
            /tmp/BRO-PLUS-TV-FINAL.apk
            /tmp/BUILD-VERIFICATION.txt
            /tmp/aapt.txt
            /tmp/BRO-PLUS-TV-logo.png
            /tmp/BRO-PLUS-TV-icon.png
            /tmp/BRO-PLUS-TV-banner.png
          retention-days: 14
          if-no-files-found: error

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - tag: api27-x86
            api: 27
            arch: x86
            device: tv_1080p
          - tag: api28-x86
            api: 28
            arch: x86
            device: tv_1080p
          - tag: api29-x86
            api: 29
            arch: x86
            device: tv_1080p
          - tag: api30-x86
            api: 30
            arch: x86
            device: tv_1080p
          - tag: api31-x86
            api: 31
            arch: x86
            device: tv_1080p
          - tag: api32-x86
            api: 32
            arch: x86
            device: tv_1080p
          - tag: api33-x86
            api: 33
            arch: x86
            device: tv_1080p
          - tag: api34-x86
            api: 34
            arch: x86
            device: tv_1080p
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BRO-PLUS-TV-BUILD
          path: /tmp/build

      - uses: android-actions/setup-android@v3

      - name: Install Android TV emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-${{ matrix.api }};android-tv;${{ matrix.arch }}'

      - name: Boot Android TV emulator robustly
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ matrix.tag }}'
          AVD="brotv_${TAG}"
          IMAGE="system-images;android-${{ matrix.api }};android-tv;${{ matrix.arch }}"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_AVD_HOME="/tmp/avd-${TAG}"
          mkdir -p "$ANDROID_AVD_HOME"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"
          test -x "$ADB"
          echo no | "$AVDMANAGER" create avd -n "$AVD" -k "$IMAGE" --device '${{ matrix.device }}' --force
          echo 'AVDs after creation:'
          "$EMULATOR" -list-avds | tee "/tmp/avd-list-${TAG}.txt"
          grep -qx "$AVD" "/tmp/avd-list-${TAG}.txt"
          "$ADB" start-server
          ACCEL='off'
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ACCEL='on'
          fi
          : > "/tmp/emulator-${TAG}.log"
          BOOTED=''
          for attempt in 1 2; do
            "$ADB" emu kill >/dev/null 2>&1 || true
            sleep 2
            nohup "$EMULATOR" -avd "$AVD" -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader -accel "$ACCEL" -camera-back none -camera-front none >> "/tmp/emulator-${TAG}.log" 2>&1 &
            EMU_PID=$!
            echo "attempt=$attempt pid=$EMU_PID accel=$ACCEL" | tee -a "/tmp/emulator-${TAG}.log"
            for i in $(seq 1 150); do
              if ! kill -0 "$EMU_PID" 2>/dev/null; then
                echo 'emulator process exited early' | tee -a "/tmp/emulator-${TAG}.log"
                break
              fi
              SERIAL="$($ADB devices | awk '/^emulator-[0-9]+[[:space:]]+device$/{print $1; exit}')"
              if [ -n "$SERIAL" ]; then
                BOOTED="$($ADB -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$BOOTED" = '1' ]; then
                  echo "$SERIAL" > "/tmp/serial-${TAG}.txt"
                  break
                fi
              fi
              sleep 2
            done
            [ "$BOOTED" = '1' ] && break
            kill "$EMU_PID" >/dev/null 2>&1 || true
            wait "$EMU_PID" 2>/dev/null || true
            if [ "$ACCEL" = 'on' ]; then ACCEL='off'; else ACCEL='on'; fi
          done
          if [ "$BOOTED" != '1' ]; then
            cat "/tmp/emulator-${TAG}.log"
            exit 1
          fi
          SERIAL="$(cat /tmp/serial-${TAG}.txt)"
          "$ADB" -s "$SERIAL" shell input keyevent 82 || true
          "$ADB" -s "$SERIAL" shell wm size | tee "/tmp/wm-${TAG}.txt"

      - name: Install launch and capture BRO PLUS TV
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ matrix.tag }}'
          export ANDROID_AVD_HOME="/tmp/avd-${TAG}"
          ADB="$ANDROID_HOME/platform-tools/adb"
          SERIAL="$(cat /tmp/serial-${TAG}.txt)"
          APK=/tmp/build/BRO-PLUS-TV-FINAL.apk
          "$ADB" -s "$SERIAL" install -r "$APK" | tee "/tmp/install-${TAG}.txt"
          "$ADB" -s "$SERIAL" logcat -c
          "$ADB" -s "$SERIAL" shell am force-stop com.brotv.iptv
          "$ADB" -s "$SERIAL" shell am start -W -n com.brotv.iptv/.MainActivity | tee "/tmp/start-${TAG}.txt"
          sleep 8
          test -n "$($ADB -s "$SERIAL" shell pidof com.brotv.iptv | tr -d '\r')"
          "$ADB" -s "$SERIAL" exec-out screencap -p > "/tmp/01-login-${TAG}.png"
          "$ADB" -s "$SERIAL" shell uiautomator dump /sdcard/ui.xml || true
          "$ADB" -s "$SERIAL" pull /sdcard/ui.xml "/tmp/ui-${TAG}.xml" || true
          for key in 22 22 20 20 21 19 23 22 20 19 21 23 4 22 21 20 19 23; do
            "$ADB" -s "$SERIAL" shell input keyevent "$key" || true
            sleep 0.35
          done
          sleep 3
          test -n "$($ADB -s "$SERIAL" shell pidof com.brotv.iptv | tr -d '\r')"
          "$ADB" -s "$SERIAL" exec-out screencap -p > "/tmp/02-after-dpad-${TAG}.png"
          "$ADB" -s "$SERIAL" shell dumpsys activity activities > "/tmp/activity-${TAG}.txt"
          grep -q 'com.brotv.iptv/.MainActivity' "/tmp/activity-${TAG}.txt"
          "$ADB" -s "$SERIAL" logcat -d -v time > "/tmp/logcat-${TAG}.txt"
          if grep -A30 -B8 -E 'FATAL EXCEPTION|ANR in com\.brotv\.iptv|Process: com\.brotv\.iptv' "/tmp/logcat-${TAG}.txt" > "/tmp/crashes-${TAG}.txt"; then
            cat "/tmp/crashes-${TAG}.txt"
            exit 1
          fi
          : > "/tmp/crashes-${TAG}.txt"
          {
            echo '# Emulator verification'
            echo 'Config: ${{ matrix.tag }}'
            echo 'Android TV API: ${{ matrix.api }}'
            echo 'Architecture: ${{ matrix.arch }}'
            echo 'Install: PASS'
            echo 'Launch: PASS'
            echo 'Screenshots: PASS'
            echo 'D-pad smoke: PASS'
            echo 'Crash/ANR scan: PASS'
          } > "/tmp/EMU-${TAG}-VERIFICATION.txt"

      - name: Upload emulator screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRO-PLUS-TV-EMU-${{ matrix.tag }}
          path: |
            /tmp/EMU-${{ matrix.tag }}-VERIFICATION.txt
            /tmp/01-login-${{ matrix.tag }}.png
            /tmp/02-after-dpad-${{ matrix.tag }}.png
            /tmp/ui-${{ matrix.tag }}.xml
            /tmp/activity-${{ matrix.tag }}.txt
            /tmp/logcat-${{ matrix.tag }}.txt
            /tmp/crashes-${{ matrix.tag }}.txt
            /tmp/emulator-${{ matrix.tag }}.log
            /tmp/install-${{ matrix.tag }}.txt
            /tmp/start-${{ matrix.tag }}.txt
            /tmp/wm-${{ matrix.tag }}.txt
            /tmp/avd-list-${{ matrix.tag }}.txt
          retention-days: 14
          if-no-files-found: warn

  ready:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BRO-PLUS-TV-BUILD
          path: /tmp/build
      - name: Keep build candidate available while emulator sweep runs
        shell: bash
        run: cp /tmp/build/BRO-PLUS-TV-FINAL.apk /tmp/BRO-PLUS-TV-CANDIDATE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BRO-PLUS-TV-CANDIDATE
          path: /tmp/BRO-PLUS-TV-CANDIDATE.apk
          retention-days: 14
          if-no-files-found: error
