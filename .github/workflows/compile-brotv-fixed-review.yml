name: Compile BROTV Fixed Source Review

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/compile-brotv-fixed-review.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: s5n76kvoxiuJ
      FILE_ID: 01a09d3cca9573159649f7a377095973
      EXPECTED_SIZE: '3563259'
      EXPECTED_SHA256: 8e17f7cf5204e472debfad55f2601afb6b246b947a584eb05107b8dacf5c1178
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Download exact fixed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-fixed-review
          mkdir -p /tmp/brotv-fixed-review
          cd /tmp/brotv-fixed-review
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'com.example.iptvplayer' app/build.gradle.kts
          grep -q 'audioOutputMode' app/src/main/java/com/example/iptvplayer/data/PrefsManager.kt
          grep -q 'setMediaCodecSelector' app/src/main/java/com/example/iptvplayer/player/PlayerEngine.kt
          grep -q 'PortableBackupCipher' app/src/main/java/com/example/iptvplayer/data/BackupManager.kt
          ! grep -R 'setAudioSink' -n app/src/main/java

      - name: Compile Kotlin only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:compileDebugKotlin
