name: BRO TV 1.2.1 Verification

on:
  push:
    branches: [ brotv-1.2.1-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='dyYOamU4Jmb7'
          FILE_ID='01a0a1d4d7e377d5ba123dbd9a052657'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"
          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/cushion-sessions" -H 'Content-Type: application/json' --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          curl -sSfL -c "$COOKIE" -b "$COOKIE" "https://firestorage.ai/ja/go/$CUSHION_ID/" -o "$RUNNER_TEMP/cushion.html"
          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/BRO_TV_1.2.1_source.zip"
          echo 'cf54da69afd435c15fc461df089028713382e6919a390b3e87f78621e4181f4a  '"$RUNNER_TEMP/BRO_TV_1.2.1_source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$RUNNER_TEMP/BRO_TV_1.2.1_source.zip" -d "$GITHUB_WORKSPACE/project"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/nonexistent}"
          test -d "$ANDROID_HOME/platforms/android-34"

      - name: Verify source version
        working-directory: project
        shell: bash
        run: |
          grep -n 'versionCode = 6' app/build.gradle.kts
          grep -n 'versionName = "1.2.1"' app/build.gradle.kts

      - name: Run unit tests
        working-directory: project
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/apk-sha256.txt"
          cp "$APK" "$GITHUB_WORKSPACE/BRO-TV-1.2.1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-1.2.1-APK
          path: |
            BRO-TV-1.2.1.apk
            apk-sha256.txt
          retention-days: 30
