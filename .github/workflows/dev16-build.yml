name: BRO TV dev16 Build

on:
  push:
    branches: [codex/build-latest-dev15]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct archived dev15 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ci-src /tmp/dev15-source.zip
          mkdir ci-src
          cat build-source.zip.part-* > /tmp/dev15-source.zip
          unzip -q /tmp/dev15-source.zip -d ci-src
          PROJECT_ROOT="$(dirname "$(find ci-src -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          grep -q 'com.brotv.player' "$PROJECT_ROOT/app/build.gradle.kts"
      - name: Inspect Firestorage client API
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o /tmp/fire.js
          wc -c /tmp/fire.js
          python3 - <<'PY'
          import re
          s=open('/tmp/fire.js','r',encoding='utf-8',errors='ignore').read()
          for pat in [r'https?[^"\'\\ ]+', r'/api/[^"\'\\ ]+', r'api[^"\'\\ ]{0,160}', r'download[^"\'\\ ]{0,200}', r'public[^"\'\\ ]{0,200}']:
              print('\nPATTERN',pat)
              seen=[]
              for m in re.finditer(pat,s,re.I):
                  v=m.group(0)
                  if v not in seen:
                      seen.append(v); print(v[:400])
                      if len(seen)>=40: break
          PY
