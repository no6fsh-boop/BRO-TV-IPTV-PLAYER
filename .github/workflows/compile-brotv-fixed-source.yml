name: Compile Check Fixed BROTV Source

on:
  push:
    branches:
      - check/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/compile-brotv-fixed-source.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: fwUJx9CpOWdT
      FILE_ID: 01a09d2db4e172258bf311acdd6acedf
      EXPECTED_SIZE: '3555326'
      EXPECTED_SHA256: 72f23cedbd68f2fa1c8371e4e43450e140844709b640a39a1af8279ce8e3bc59
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4
        with:
          ref: check/brotv-fixed-source-20260914

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Download exact fixed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-fixed
          mkdir -p /tmp/brotv-fixed
          cd /tmp/brotv-fixed
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d)
              sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null
          mkdir source
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'com.example.iptvplayer' app/build.gradle.kts
          test -f app/src/main/java/com/example/iptvplayer/player/PlayerEngine.kt
          test -f app/src/main/java/com/example/iptvplayer/player/DynamicBufferController.kt
          test -f app/src/main/java/com/example/iptvplayer/data/StreamHealthScore.kt
          ! grep -R 'setAudioSink' -n app/src/main/java/com/example/iptvplayer || (echo 'Invalid setAudioSink call remains' && exit 9)

      - name: Compile Kotlin only - no APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:compileDebugKotlin
