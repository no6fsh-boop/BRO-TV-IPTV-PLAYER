name: Generate Gradle 8.6 Wrapper Jar

on:
  push:
    branches:
      - check/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/generate-gradle-wrapper-86.yml'
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Generate official wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wrappergen
          mkdir -p /tmp/wrappergen
          cd /tmp/wrappergen
          printf "rootProject.name = 'wrappergen'\n" > settings.gradle
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          test -f gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar
      - name: Upload wrapper jar
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.6-jar
          path: /tmp/wrappergen/gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 1
