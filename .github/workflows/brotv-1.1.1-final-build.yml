name: BRO TV 1.1.1 Final Build

on:
  push:
    branches: [ brotv-1.1.1-build ]
    paths:
      - '.github/workflows/brotv-1.1.1-final-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve and download BRO TV 1.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='lEBDjxoMWwC_'
          FILE_ID='01a0a0eaa57c751cb8308a4c658d1be2'
          COOKIE="$RUNNER_TEMP/firestorage.cookies"

          SESSION=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST \
            "$API/shares/$SHARE/cushion-sessions" \
            -H 'Content-Type: application/json' \
            --data '{"password":null}')
          CUSHION_ID=$(printf '%s' "$SESSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cushionId"])')
          test -n "$CUSHION_ID"

          curl -sSfL -c "$COOKIE" -b "$COOKIE" \
            "https://firestorage.ai/ja/go/$CUSHION_ID/" \
            -o "$RUNNER_TEMP/cushion.html"

          DOWNLOAD_META=$(curl -sSf -c "$COOKIE" -b "$COOKIE" -X POST \
            "$API/shares/$SHARE/files/$FILE_ID/download")
          DOWNLOAD_URL=$(printf '%s' "$DOWNLOAD_META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')
          test -n "$DOWNLOAD_URL"

          curl -sSfL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/BRO_TV_1.1.1_source.zip"
          echo 'c381a0660d98704937598b2e272472496686043fab748123f55cf9b42b8e3c65  '"$RUNNER_TEMP/BRO_TV_1.1.1_source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$RUNNER_TEMP/BRO_TV_1.1.1_source.zip" -d "$GITHUB_WORKSPACE/project"
          test -f "$GITHUB_WORKSPACE/project/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/project/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android 34 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Verify project version
        working-directory: project
        shell: bash
        run: |
          grep -n 'versionCode = 3' app/build.gradle.kts
          grep -n 'versionName = "1.1.1"' app/build.gradle.kts

      - name: Run unit tests
        working-directory: project
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/BRO-TV-1.1.1.apk"
          ls -lh "$GITHUB_WORKSPACE/BRO-TV-1.1.1.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-1.1.1-APK
          path: BRO-TV-1.1.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view bro-tv-1.1.1 >/dev/null 2>&1; then
            gh release upload bro-tv-1.1.1 BRO-TV-1.1.1.apk --clobber
          else
            gh release create bro-tv-1.1.1 BRO-TV-1.1.1.apk \
              --title 'BRO TV 1.1.1' \
              --notes 'Installable debug-signed Android APK built from the verified BRO TV 1.1.1 source package.'
          fi
