name: BROTV Android Build Toolchain

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: /tmp/brotv-gradle-home
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Prime exact BROTV dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-dummy "$GRADLE_USER_HOME"
          mkdir -p /tmp/brotv-dummy/app/src/main
          cd /tmp/brotv-dummy
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IPTVPlayer"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.iptvplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.iptvplayer"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { viewBinding = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.leanback:leanback:1.0.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.zxing:core:3.5.3")
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("io.coil-kt:coil:2.6.0")
          }
          EOF
          : > app/proguard-rules.pro
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" /></manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar" /></resources>
          EOF
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon wrapper --gradle-version 8.6 --distribution-type bin
          ./gradlew --no-daemon --version

      - name: Package offline build toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/brotv-toolchain/sdk /tmp/brotv-toolchain/project-wrapper /tmp/brotv-toolchain/gradle-home
          cp -a "$ANDROID_HOME/platforms" /tmp/brotv-toolchain/sdk/
          cp -a "$ANDROID_HOME/build-tools" /tmp/brotv-toolchain/sdk/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/brotv-toolchain/sdk/
          cp -a "$ANDROID_HOME/licenses" /tmp/brotv-toolchain/sdk/
          cp -a /tmp/brotv-dummy/gradlew /tmp/brotv-toolchain/project-wrapper/
          cp -a /tmp/brotv-dummy/gradle /tmp/brotv-toolchain/project-wrapper/
          cp -a "$GRADLE_USER_HOME/caches" /tmp/brotv-toolchain/gradle-home/
          cp -a "$GRADLE_USER_HOME/wrapper" /tmp/brotv-toolchain/gradle-home/
          tar -C /tmp -czf /tmp/BROTV-offline-toolchain.tar.gz brotv-toolchain
          ls -lh /tmp/BROTV-offline-toolchain.tar.gz

      - name: Upload offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-offline-toolchain
          path: /tmp/BROTV-offline-toolchain.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
