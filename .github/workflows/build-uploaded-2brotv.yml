name: BROTV Exact Source Download Probe

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact uploaded source share
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/GFj2k3kXNlKS
          PUBLIC_ID: o4vHfa0oAn6vWJNR
          FILE_ID: 01a09c3dea0d736bb8f4acaa1f0aed0c
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe && cd /tmp/probe
          curl -fsSL -A 'Mozilla/5.0' "$SHARE_URL" -o page.html
          echo '=== HTML useful lines ==='
          grep -Eo 'https?://[^"<> ]+|src="[^"]+\.js[^"]*"|href="[^"]+"' page.html | head -200 || true
          echo '=== scripts ==='
          python3 - <<'PY'
          import re, html, urllib.parse, subprocess, pathlib, os
          t=pathlib.Path('page.html').read_text(errors='ignore')
          t=html.unescape(t).replace('\\/','/')
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',t,re.I):
              u=urllib.parse.urljoin(os.environ['SHARE_URL'],m.group(1))
              if u not in scripts: scripts.append(u)
          print('count',len(scripts))
          for i,u in enumerate(scripts):
              print(i,u)
              try:
                  subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',u,'-o',f's{i}.js'],check=True)
              except Exception as e:
                  print('ERR',e)
          needles=['download','presign','signed','/api/','public_id','publicId','file_id','fileId','share','storage','r2','s3','blob']
          for i in range(len(scripts)):
              p=pathlib.Path(f's{i}.js')
              if not p.exists(): continue
              js=p.read_text(errors='ignore')
              hits=[]
              for needle in needles:
                  for m in re.finditer(re.escape(needle),js,re.I):
                      s=max(0,m.start()-220); e=min(len(js),m.end()+420)
                      sn=js[s:e].replace('\n',' ')
                      if sn not in hits: hits.append(sn)
                      if len(hits)>=12: break
                  if len(hits)>=12: break
              if hits:
                  print(f'\n=== JS {i} hits ({len(js)} bytes) ===')
                  for h in hits: print(h[:900])
          print('\n=== HTML ids ===')
          for needle in [os.environ['PUBLIC_ID'],os.environ['FILE_ID'],'2BROTV_Player.zip']:
              print(needle, needle in t)
              if needle in t:
                  pos=t.find(needle); print(t[max(0,pos-600):pos+1200])
          PY
          exit 1
