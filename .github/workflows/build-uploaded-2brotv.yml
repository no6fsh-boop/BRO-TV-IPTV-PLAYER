name: Publish Exact 2BROTV APK

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
    paths:
      - '.github/workflows/build-uploaded-2brotv.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: build/uploaded-2brotv-20260913

      - name: Download APK from successful exact-source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/exact-apk
          mkdir -p /tmp/exact-apk
          gh run download 34777865519 --repo "$GITHUB_REPOSITORY" --name 2BROTV-Player-Exact-APK --dir /tmp/exact-apk
          test -f /tmp/exact-apk/2BROTV_Player.apk
          echo 'afc8bba65c138b1a1f4a73c7249f1a26da70e8faf994b4274db03a92fd16604a  /tmp/exact-apk/2BROTV_Player.apk' | sha256sum -c -

      - name: Publish direct APK on branch
        run: |
          set -euo pipefail
          mkdir -p built-apk-exact
          cp /tmp/exact-apk/2BROTV_Player.apk built-apk-exact/2BROTV_Player.apk
          cp /tmp/exact-apk/2BROTV_Player.apk.sha256 built-apk-exact/2BROTV_Player.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add built-apk-exact/2BROTV_Player.apk built-apk-exact/2BROTV_Player.apk.sha256
          git commit -m 'artifact: publish exact uploaded 2BROTV APK' || exit 0
          git push origin HEAD:build/uploaded-2brotv-20260913
