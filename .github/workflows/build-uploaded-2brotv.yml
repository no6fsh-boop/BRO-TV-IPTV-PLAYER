name: BROTV Exact Source API Probe

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Isolate exact source download API
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/GFj2k3kXNlKS
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe && cd /tmp/probe
          curl -fsSL -A 'Mozilla/5.0' "$SHARE_URL" -o page.html
          python3 - <<'PY'
          import re, html, urllib.parse, subprocess, pathlib, os
          t=html.unescape(pathlib.Path('page.html').read_text(errors='ignore')).replace('\\/','/')
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',t,re.I):
              u=urllib.parse.urljoin(os.environ['SHARE_URL'],m.group(1))
              if u not in scripts: scripts.append(u)
          for i,u in enumerate(scripts):
              try: subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',u,'-o',f's{i}.js'],check=True)
              except Exception: pass
          for i in range(len(scripts)):
              p=pathlib.Path(f's{i}.js')
              if not p.exists(): continue
              js=p.read_text(errors='ignore')
              strings=[]
              for m in re.finditer(r'(["\'])(.{1,360}?)\1',js):
                  s=m.group(2)
                  ls=s.lower()
                  if any(k in ls for k in ['download','presign','signed','/api','objects/','files/','share','publicid','fileid','prepare']):
                      if s not in strings: strings.append(s)
              if strings:
                  print(f'\n### STRINGS JS {i} {scripts[i]} bytes={len(js)}')
                  for s in strings[:220]: print(s)
              for key in ['downloadUrl','download_url','download-url','prepareDownload','createDownload','signedUrl','presignedUrl','objects/','/api/']:
                  loc=[m.start() for m in re.finditer(re.escape(key),js,re.I)]
                  if loc:
                      print(f'\n### CONTEXT JS {i} key={key} count={len(loc)}')
                      for pos in loc[:20]:
                          print(js[max(0,pos-700):min(len(js),pos+1400)].replace('\n',' ')[:2100])
          PY
          exit 1
