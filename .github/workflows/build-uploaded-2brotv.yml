name: BROTV Android Build Toolchain Split

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: /tmp/brotv-gradle-home
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 34 is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi
          ls -ld "$ANDROID_HOME/platforms/android-34" "$ANDROID_HOME/build-tools/34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Prime exact BROTV dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-dummy "$GRADLE_USER_HOME"
          mkdir -p /tmp/brotv-dummy/app/src/main
          cd /tmp/brotv-dummy
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IPTVPlayer"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.iptvplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.iptvplayer"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { viewBinding = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.leanback:leanback:1.0.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.zxing:core:3.5.3")
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("io.coil-kt:coil:2.6.0")
          }
          EOF
          : > app/proguard-rules.pro
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" /></manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar" /></resources>
          EOF
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon wrapper --gradle-version 8.6 --distribution-type bin
          ./gradlew --no-daemon --version

      - name: Package split offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$ANDROID_HOME" -czf /tmp/BROTV-sdk34.tar.gz platforms/android-34 build-tools/34.0.0 platform-tools licenses
          tar -C "$GRADLE_USER_HOME" -czf /tmp/BROTV-gradle-modules.tar.gz caches/modules-2
          tar -C "$GRADLE_USER_HOME" --exclude='caches/modules-2' -czf /tmp/BROTV-gradle-work.tar.gz caches wrapper
          tar -C /tmp/brotv-dummy -czf /tmp/BROTV-project-wrapper.tar.gz gradlew gradle
          ls -lh /tmp/BROTV-*.tar.gz

      - name: Upload SDK 34
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-sdk34
          path: /tmp/BROTV-sdk34.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Gradle modules
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-gradle-modules
          path: /tmp/BROTV-gradle-modules.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Gradle work cache
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-gradle-work
          path: /tmp/BROTV-gradle-work.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload project wrapper
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-project-wrapper
          path: /tmp/BROTV-project-wrapper.tar.gz
          compression-level: 0
          retention-days: 1
