name: Build Developed BROTV v2 APK

on:
  push:
    branches:
      - build/developed-brotv-v2-20260914
    paths:
      - '.github/workflows/build-uploaded-2brotv.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: NeJMz0_DWDh8
      FILE_ID: 01a09cb4541d773bb508afcd772ed14a
      EXPECTED_SIZE: '3545008'
      EXPECTED_SHA256: acce211bf3a4b2eca39ff3a42e14ae94b90fc859bfd900ae5a4d45027a4a72b1
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build/developed-brotv-v2-20260914

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Download exact developed v2 source uploaded by user
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-developed-v2
          mkdir -p /tmp/brotv-developed-v2
          cd /tmp/brotv-developed-v2
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d)
              sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip >/dev/null
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify developed v2 project identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'com.example.iptvplayer' app/build.gradle.kts
          test -f app/src/main/java/com/example/iptvplayer/player/PlayerEngine.kt
          test -f app/src/main/java/com/example/iptvplayer/security/CredentialCipher.kt
          grep -q 'extractHttpStatusCode' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          grep -q 'checkForFreeze' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          echo 'Developed BROTV v2 source identity verified.'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/BROTV_Developed_v2.apk"
          sha256sum "$GITHUB_WORKSPACE/out/BROTV_Developed_v2.apk" | tee "$GITHUB_WORKSPACE/out/BROTV_Developed_v2.apk.sha256"
          ls -lh "$GITHUB_WORKSPACE/out/BROTV_Developed_v2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Developed-v2-APK
          path: |
            out/BROTV_Developed_v2.apk
            out/BROTV_Developed_v2.apk.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Publish direct APK on build branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p built-apk-developed-v2
          cp out/BROTV_Developed_v2.apk built-apk-developed-v2/BROTV_Developed_v2.apk
          cp out/BROTV_Developed_v2.apk.sha256 built-apk-developed-v2/BROTV_Developed_v2.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add built-apk-developed-v2/BROTV_Developed_v2.apk built-apk-developed-v2/BROTV_Developed_v2.apk.sha256
          git commit -m 'artifact: publish developed BROTV v2 APK' || exit 0
          git push origin HEAD:build/developed-brotv-v2-20260914
