name: Build Uploaded 2BROTV APK

on:
  push:
    branches:
      - build/uploaded-2brotv-20260913
  workflow_dispatch:

jobs:
  inspect-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Firestorage download API
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/fRZ-A6rpIrhW
        run: |
          set -euo pipefail
          mkdir -p /tmp/fire && cd /tmp/fire
          curl -fsSL -A 'Mozilla/5.0' "$SHARE_URL" -o share.html
          CHUNK=$(grep -oE 'src="[^"]*app/\(files\)/ja/f/page-[^"]+\.js"' share.html | head -1 | sed -E 's/^src="//;s/"$//')
          echo "CHUNK=$CHUNK"
          curl -fsSL -A 'Mozilla/5.0' "https://firestorage.ai${CHUNK}" -o page.js
          python3 - <<'PY'
          import re
          t=open('page.js',errors='ignore').read()
          print('JS bytes', len(t))
          needles=['download','/api/','public_id','file_id','share','fetch(','axios','presign','signed','token']
          seen=set()
          for needle in needles:
              print('\n###',needle)
              for m in list(re.finditer(re.escape(needle),t,re.I))[:30]:
                  s=max(0,m.start()-260); e=min(len(t),m.end()+500)
                  x=t[s:e].replace('\\n',' ').replace('\n',' ')
                  if x not in seen:
                      seen.add(x); print(x[:1000])
          print('\n### string paths')
          for s in sorted(set(re.findall(r'["\']([^"\']{1,240})["\']',t))):
              ls=s.lower()
              if any(k in ls for k in ['api','download','file','share','public','presign']):
                  print(s[:500])
          PY
          exit 2
