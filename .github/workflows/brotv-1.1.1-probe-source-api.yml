name: BRO TV 1.1.1 Probe Source API

on:
  push:
    branches: [ brotv-1.1.1-build ]
    paths:
      - '.github/workflows/brotv-1.1.1-probe-source-api.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source metadata
        run: |
          curl -L --fail --silent --show-error 'https://api.firestorage.ai/dev/file/shares/lEBDjxoMWwC_/files?maxResults=1000'
