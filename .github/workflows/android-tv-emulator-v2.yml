name: BRO TV QA Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  inspect-firestorage-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Firestorage parser
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/ja/f/etjN4JxWE3PV"
          curl -LfsS "$PAGE" -o /tmp/share.html
          python3 - <<'PY' > /tmp/scripts.txt
          import re
          s=open('/tmp/share.html',encoding='utf-8',errors='replace').read()
          for x in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',s,flags=re.I): print(x)
          PY
          : > /tmp/alljs
          while IFS= read -r src; do
            case "$src" in http*) url="$src";; *) url="$BASE$src";; esac
            curl -LfsS "$url" >> /tmp/alljs || true
            printf '\n' >> /tmp/alljs
          done < /tmp/scripts.txt
          python3 - <<'PY'
          import re
          s=open('/tmp/alljs',encoding='utf-8',errors='replace').read()
          for needle in ['shareEndpoint','shares/${e[1]}','/objects/','/files?maxResults=1000','X-Firestorage-Share-Password','api.firestorage.ai/prod']:
              print('\n===== NEEDLE',needle,'=====')
              pos=0; count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0 or count>=8: break
                  print(s[max(0,i-1800):min(len(s),i+2600)])
                  print('\n---')
                  pos=i+len(needle); count+=1
          PY
