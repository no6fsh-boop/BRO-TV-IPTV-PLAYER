name: BRO TV 3.2.0 Lint Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  lint-diagnostic:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download BRO TV 3.2.0 source v2
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/prod/file'
          SHARE='Tb_0xLTC20h7'
          curl -fLss "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          target='BROTV-3.2.0-competitive-pack-source-v2.zip'
          matches=[x for x in d.get('files',[]) if x.get('fileName')==target]
          if not matches:
              raise SystemExit('source file not found')
          print(matches[0]['fileId'])
          PY
          )
          curl -fLss -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json'))['downloadUrl'])
          PY
          )
          curl -fL "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Lint debug - print every blocker
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug
          CODE=$?
          REPORT='app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          echo '===== ALL LINT ERRORS ====='
          if [ -f "$REPORT" ]; then
            grep -n -B2 -A4 'Error:' "$REPORT" || cat "$REPORT"
          else
            echo 'Lint text report not found'
          fi
          echo '===== END LINT ERRORS ====='
          exit $CODE
