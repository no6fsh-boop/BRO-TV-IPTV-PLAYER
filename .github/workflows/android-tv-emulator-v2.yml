name: BRO TV 3.1 QA Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Download latest BRO TV QA source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/prod/file'
          SHARE='zdsC5KRwr4dm'
          NAME='BROTV-3.1.0-QA-build-source-min23.zip'
          curl -fLss "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          target='BROTV-3.1.0-QA-build-source-min23.zip'
          matches=[x for x in d.get('files',[]) if x.get('fileName')==target]
          if not matches:
              raise SystemExit('source file not found in Firestorage share')
          print(matches[0]['fileId'])
          PY
          )
          curl -fLss -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json'))['downloadUrl'])
          PY
          )
          curl -fL "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          unzip -t /tmp/brotv-source.zip
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew" "$PROJECT_DIR/ci/"*.sh || true
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          sha256sum /tmp/brotv-source.zip

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Validate APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.brotv.player.debug'" /tmp/apk-badging.txt
          bash ci/check_native_16k.sh "$APK"
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Detect available Android TV image
        id: tvimage
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > /tmp/sdk-list.txt
          API_LEVEL=$(grep -oE 'system-images;android-[0-9]+;android-tv;x86_64' /tmp/sdk-list.txt \
            | sed -E 's/system-images;android-([0-9]+);android-tv;x86_64/\1/' \
            | sort -nr | head -n1)
          if [ -z "$API_LEVEL" ]; then
            echo 'No Android TV x86_64 system image available' >&2
            exit 1
          fi
          echo "api=$API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "Selected Android TV API $API_LEVEL"

      - name: Android TV emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tvimage.outputs.api }}
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd "$PROJECT_DIR" && bash ci/android_tv_qa.sh

      - name: Copy QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/qa-output"
          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            cp -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/qa-output/BROTV-3.1.0-QA.apk" 2>/dev/null || true
            cp -f "$PROJECT_DIR"/*.png "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true
            cp -f "$PROJECT_DIR"/*.txt "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true
            cp -f "$PROJECT_DIR"/*.log "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true
          fi
          cp -f /tmp/apk-badging.txt /tmp/apk-sha256.txt "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true

      - name: Upload APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.1.0-QA-APK
          path: qa-output/
          if-no-files-found: warn
