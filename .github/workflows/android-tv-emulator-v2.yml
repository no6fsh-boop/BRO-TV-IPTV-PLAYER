name: BRO TV 3.1 QA Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  lint-current-point:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download BRO TV source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/prod/file'
          SHARE='kKb3B_t8uy3g'
          NAME='BROTV-3.1.0-QA-build-source-min23-v3.zip'
          curl -fLss "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          target='BROTV-3.1.0-QA-build-source-min23-v3.zip'
          print(next(x['fileId'] for x in d['files'] if x['fileName']==target))
          PY
          )
          curl -fLss -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json'))['downloadUrl'])
          PY
          )
          curl -fL "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Lint debug with complete report
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug
          STATUS=$?
          REPORT='app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          echo '========== FULL LINT REPORT =========='
          if [ -f "$REPORT" ]; then cat "$REPORT"; else echo 'Lint text report not found'; fi
          echo '========== END LINT REPORT =========='
          exit $STATUS
