name: BRO TV 3.2.0 Lint Retest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  lint-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download BRO TV 3.2.0 v4 source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='c-O9dqMRvv6q'
          TARGET='BROTV-3.2.0-feature-pack-source-v4.zip'
          CURL=(-4 --http1.1 -A 'Mozilla/5.0 BROTV-CI/3.2' --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180)
          curl -fLss "${CURL[@]}" "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          target='BROTV-3.2.0-feature-pack-source-v4.zip'
          files=d.get('files', d if isinstance(d,list) else [])
          matches=[x for x in files if x.get('fileName')==target or x.get('name')==target]
          if not matches: raise SystemExit('target source not found')
          print(matches[0].get('fileId') or matches[0].get('id'))
          PY
          )
          curl -fLss "${CURL[@]}" -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/download.json'))
          print(d.get('downloadUrl') or d.get('download_url') or '')
          PY
          )
          test -n "$DOWNLOAD_URL"
          curl -fL "${CURL[@]}" "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          unzip -t /tmp/brotv-source.zip >/dev/null
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          sha256sum /tmp/brotv-source.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Lint debug only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.2.0-v4-Lint
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
