name: BRO TV 3.3.7 Source Export
on:
  workflow_dispatch:
  push:
    branches: [ qa/live-preload-no-apk ]
    paths: ['.github/workflows/android-tv-emulator-v2.yml']
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download BRO TV 3.3.7 source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='61O38Z0fa7EC'
          TARGET='BROTV-3.3.7-player-stability-source-v2.zip'
          CURL=(-4 --http1.1 -A 'BROTV-CI/3.3.7' --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180)
          curl -fLss "${CURL[@]}" "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 -c "import json;d=json.load(open('/tmp/files.json'));fs=d.get('files',d if isinstance(d,list) else []);m=[x for x in fs if x.get('fileName')=='$TARGET' or x.get('name')=='$TARGET'];print((m[0].get('fileId') or m[0].get('id')) if m else '')")
          test -n "$FILE_ID"
          curl -fLss "${CURL[@]}" -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 -c "import json;d=json.load(open('/tmp/download.json'));print(d.get('downloadUrl') or d.get('download_url') or '')")
          test -n "$DOWNLOAD_URL"
          curl -fL "${CURL[@]}" "$DOWNLOAD_URL" -o /tmp/BROTV-3.3.7-source.zip
          unzip -t /tmp/BROTV-3.3.7-source.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.3.7-Source
          path: /tmp/BROTV-3.3.7-source.zip
          if-no-files-found: error
