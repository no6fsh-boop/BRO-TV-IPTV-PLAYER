name: BRO TV QA Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  inspect-firestorage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source share
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://firestorage.ai/ja/f/etjN4JxWE3PV'
          curl -LfsS -D /tmp/headers.txt "$URL" -o /tmp/share.html
          echo '=== HEADERS ==='
          cat /tmp/headers.txt
          echo '=== TYPE/SIZE ==='
          file /tmp/share.html
          wc -c /tmp/share.html
          echo '=== LINKS AND CONTEXT ==='
          python3 - <<'PY'
          import re, html
          s=open('/tmp/share.html','r',encoding='utf-8',errors='replace').read()
          vals=[]
          vals += re.findall(r'https?://[^\"\'<> ]+', s)
          vals += re.findall(r'(?:href|src)=[\"\']([^\"\']+)', s)
          for x in sorted(set(vals)):
              if any(k in x.lower() for k in ('download','zip','file','api','storage','assets','js')):
                  print(x)
          print('=== CONTEXT ===')
          for m in re.finditer(r'(?i)(download|zip|file_id|public_id|BROTV|etjN4JxWE3PV|api/|/api)', s):
              a=max(0,m.start()-240); b=min(len(s),m.end()+500)
              print(html.unescape(s[a:b]).replace('\n',' '))
          print('=== SCRIPT SRCS ===')
          for x in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', s, flags=re.I): print(x)
          PY
