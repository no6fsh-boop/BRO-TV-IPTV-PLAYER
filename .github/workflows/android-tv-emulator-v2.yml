name: BRO TV 3.2.0 Competitive QA Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve BRO TV 3.2 source from public share
        shell: bash
        run: |
          set -euxo pipefail
          SHARE_PAGE='https://firestorage.ai/ja/f/uzThi0m16yzu'
          curl -4 --http1.1 -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 BROTV-CI/3.2' "$SHARE_PAGE" -o /tmp/share.html
          test -s /tmp/share.html
          echo "Share page bytes: $(wc -c < /tmp/share.html)"

          python3 - <<'PY'
          import html, json, os, re, subprocess, sys, urllib.parse, urllib.request
          page_path='/tmp/share.html'
          text=html.unescape(open(page_path,'r',encoding='utf-8',errors='ignore').read())
          target='BROTV-3.2.0-feature-pack-source-v3.zip'

          # Surface only useful endpoint hints in the log.
          urls=[]
          for raw in re.findall(r'https?://[^\s"\'<>]+', text):
              u=raw.replace('\\u0026','&').replace('\\/','/')
              if any(k in u.lower() for k in ('wasabi','download','firestorage','source-v3')):
                  urls.append(u)
          for u in list(dict.fromkeys(urls))[:30]:
              print('URL_HINT', u[:500])
          for pat in ('downloadUrl','fileId','api.firestorage','wasabisys','BROTV-3.2.0-feature-pack-source-v3.zip'):
              print('HAS', pat, pat in text)

          candidates=[]
          # Direct URLs embedded by SSR/Next data.
          for m in re.finditer(r'"(?:downloadUrl|download_url)"\s*:\s*"([^"]+)"', text):
              candidates.append(m.group(1).replace('\\u0026','&').replace('\\/','/'))
          for u in urls:
              if 'wasabisys' in u or target in urllib.parse.unquote(u):
                  candidates.append(u)

          # Also try the known API route through the main website host if exposed/proxied.
          candidates += [
              'https://firestorage.ai/api/prod/file/shares/3ckPDEqCy6buIc2i/files/01a0e90b255376e6962e5db458ba2b05/download',
          ]

          def try_download(url):
              print('TRY', url[:350])
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 BROTV-CI/3.2','Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data=r.read()
                      ctype=r.headers.get('content-type','')
                  # Endpoint may return JSON containing a signed URL.
                  if data[:1] in (b'{', b'['):
                      try:
                          obj=json.loads(data.decode())
                          signed=obj.get('downloadUrl') or obj.get('download_url')
                          if signed:
                              return try_download(signed)
                      except Exception:
                          pass
                  if data.startswith(b'PK\x03\x04') and len(data) > 100000:
                      open('/tmp/brotv-source.zip','wb').write(data)
                      print('SOURCE_OK', len(data))
                      return True
                  print('NOT_ZIP', len(data), ctype)
              except Exception as e:
                  print('CANDIDATE_FAIL', type(e).__name__, str(e)[:240])
              return False

          for u in dict.fromkeys(candidates):
              if try_download(u):
                  sys.exit(0)

          # Last fallback: render the public page with Chrome if available, then inspect DOM.
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          if os.path.exists(chrome):
              print('CHROME_FALLBACK')
              try:
                  dom=subprocess.check_output([chrome,'--headless','--disable-gpu','--no-sandbox','--virtual-time-budget=8000','--dump-dom','https://firestorage.ai/ja/f/uzThi0m16yzu'],stderr=subprocess.STDOUT,timeout=45).decode('utf-8','ignore')
                  open('/tmp/share-rendered.html','w').write(dom)
                  print('RENDERED_BYTES',len(dom),'TARGET_PRESENT',target in dom)
                  for m in re.finditer(r'https?://[^\s"\'<>]+', html.unescape(dom)):
                      u=m.group(0).replace('\\u0026','&').replace('\\/','/')
                      if ('wasabisys' in u or target in urllib.parse.unquote(u)) and try_download(u):
                          sys.exit(0)
              except Exception as e:
                  print('CHROME_FAIL',type(e).__name__,str(e)[:300])
          raise SystemExit('Could not resolve source ZIP from public share')
          PY

          unzip -t /tmp/brotv-source.zip
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew" "$PROJECT_DIR/ci/"*.sh || true
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          shasum -a 256 /tmp/brotv-source.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Validate APK and Android TV metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.brotv.player.debug'" /tmp/apk-badging.txt
          grep -q "versionName='3.2.0-dev19'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.brotv.player.MainActivity'" /tmp/apk-badging.txt
          grep -q "uses-feature-not-required: name='android.software.leanback'" /tmp/apk-badging.txt
          grep -q "uses-feature-not-required: name='android.hardware.touchscreen'" /tmp/apk-badging.txt
          bash ci/check_native_16k.sh "$APK"
          shasum -a 256 "$APK" | tee /tmp/apk-sha256.txt

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/qa-output"
          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            cp -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/qa-output/BROTV-3.2.0-Competitive-QA.apk" 2>/dev/null || true
            cp -f "$PROJECT_DIR/app/build/reports/lint-results-debug.html" "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true
          fi
          cp -f /tmp/apk-badging.txt /tmp/apk-sha256.txt "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true

      - name: Upload APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.2.0-Competitive-QA-APK
          path: qa-output/
          if-no-files-found: error
