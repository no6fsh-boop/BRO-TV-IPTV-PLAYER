name: BRO TV QA Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  probe-firestorage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Firestorage share API
        shell: bash
        run: |
          set -euo pipefail
          ID='etjN4JxWE3PV'
          for u in \
            "https://api.firestorage.ai/prod/shares/$ID" \
            "https://api.firestorage.ai/prod/file/shares/$ID" \
            "https://api.firestorage.ai/prod/file/$ID" \
            "https://api.firestorage.ai/prod/$ID"; do
            echo "===== $u ====="
            code=$(curl -sS -L -o /tmp/body -w '%{http_code}' "$u" || true)
            echo "HTTP $code"
            head -c 5000 /tmp/body || true
            echo
          done
