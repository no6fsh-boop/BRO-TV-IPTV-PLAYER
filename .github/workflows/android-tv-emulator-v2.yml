name: BRO TV 3.2 Source Export

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='c-O9dqMRvv6q'
          TARGET='BROTV-3.2.0-feature-pack-source-v4.zip'
          CURL=(-4 --http1.1 -A 'BROTV-CI/3.2' --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180)
          curl -fLss "${CURL[@]}" "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          t='BROTV-3.2.0-feature-pack-source-v4.zip'
          files=d.get('files', [])
          m=[x for x in files if x.get('fileName')==t or x.get('name')==t]
          if not m: raise SystemExit('not found')
          print(m[0].get('fileId') or m[0].get('id'))
          PY
          )
          curl -fLss "${CURL[@]}" -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/download.json'))
          print(d.get('downloadUrl') or d.get('download_url') or '')
          PY
          )
          test -n "$DOWNLOAD_URL"
          curl -fL "${CURL[@]}" "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          unzip -t /tmp/brotv-source.zip >/dev/null
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.2.0-source-v4-bridge
          path: /tmp/brotv-source.zip
          if-no-files-found: error
