name: BRO TV 3.1.1 Premium QA Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-tv-emulator-v2.yml'

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download BRO TV 3.1.1 premium source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/prod/file'
          SHARE='j-D9inwSuIB0'
          NAME='BROTV-3.1.1-premium-QA-source.zip'
          curl -fLss "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          target='BROTV-3.1.1-premium-QA-source.zip'
          matches=[x for x in d.get('files',[]) if x.get('fileName')==target]
          if not matches:
              raise SystemExit('source file not found in Firestorage share')
          print(matches[0]['fileId'])
          PY
          )
          curl -fLss -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json'))['downloadUrl'])
          PY
          )
          curl -fL "$DOWNLOAD_URL" -o /tmp/brotv-source.zip
          unzip -t /tmp/brotv-source.zip
          rm -rf /tmp/brotv-src && mkdir -p /tmp/brotv-src
          unzip -q /tmp/brotv-source.zip -d /tmp/brotv-src
          PROJECT_DIR=$(dirname "$(find /tmp/brotv-src -maxdepth 3 -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew" "$PROJECT_DIR/ci/"*.sh || true
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          shasum -a 256 /tmp/brotv-source.zip

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Validate APK and Android TV metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.brotv.player.debug'" /tmp/apk-badging.txt
          grep -q "versionName='3.1.1-dev18'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.brotv.player.MainActivity'" /tmp/apk-badging.txt
          grep -q "uses-feature-not-required: name='android.software.leanback'" /tmp/apk-badging.txt
          grep -q "uses-feature-not-required: name='android.hardware.touchscreen'" /tmp/apk-badging.txt
          bash ci/check_native_16k.sh "$APK"
          shasum -a 256 "$APK" | tee /tmp/apk-sha256.txt

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/qa-output"
          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            cp -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/qa-output/BROTV-3.1.1-Premium-QA.apk" 2>/dev/null || true
          fi
          cp -f /tmp/apk-badging.txt /tmp/apk-sha256.txt "$GITHUB_WORKSPACE/qa-output/" 2>/dev/null || true

      - name: Upload APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-3.1.1-Premium-QA-APK
          path: qa-output/
          if-no-files-found: error
