name: Validate BROTV UX LTR Live Stability

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-uxfix-ltr-live-stability.yml'
  workflow_dispatch:

jobs:
  validate-uxfix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: Cvjeg7Mto9bc
      FILE_ID: 01a09f313bad716b8877b3738cffe5d7
      EXPECTED_SIZE: '3657971'
      EXPECTED_SHA256: 27923caf20c3c87fdb440abc70ba3a435986d67bbf942824937fa55fcbfa256e
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact UX source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-uxfix && mkdir -p /tmp/brotv-uxfix && cd /tmp/brotv-uxfix
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d); sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Static UX and stability checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          layout = Path('app/src/main/res/layout')
          files = list(layout.glob('*.xml'))
          assert files
          for p in files:
              s=p.read_text()
              m=re.search(r'<(?!\?|!)[A-Za-z_][\w.:-]*\b[^>]*>', s, re.S)
              assert m and 'android:layoutDirection="ltr"' in m.group(0), p.name
              assert 'android:layoutDirection="rtl"' not in s, p.name
          for name in ['activity_channel_browse.xml','activity_movies.xml','activity_series.xml']:
              assert 'android:layoutDirection="ltr"' in (layout/name).read_text(), name
          PY
          grep -q 'object PlaybackRecoveryPolicy' app/src/main/java/com/example/iptvplayer/player/PlaybackRecoveryPolicy.kt
          grep -q 'PlaybackRecoveryPolicyTest' app/src/test/java/com/example/iptvplayer/player/PlaybackRecoveryPolicyTest.kt
          grep -q 'UiDirectionLayoutTest' app/src/test/java/com/example/iptvplayer/ui/UiDirectionLayoutTest.kt
          grep -q 'MovieDetailActivity' app/src/main/AndroidManifest.xml
          grep -q 'btnQuality' app/src/main/res/layout/activity_full_player.xml
          grep -q 'progressRow).visibility = android.view.View.GONE' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          ! grep -q 'KEYCODE_DPAD_RIGHT ->' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          ! grep -q 'KEYCODE_DPAD_RIGHT ->' app/src/main/java/com/example/iptvplayer/ui/VodPlayerActivity.kt
          ! grep -q 'ConnectionQualityChecker.measure(url)' app/src/main/java/com/example/iptvplayer/ui/FullPlayerActivity.kt
          ! grep -q 'ConnectionQualityChecker.check(firstUrl)' app/src/main/java/com/example/iptvplayer/ui/MergedChannelAdapter.kt
      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/uxfix-apk.sha256
      - name: Detect available Android TV image
        id: tvimage
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > /tmp/sdk-list.txt
          API="$(grep -oE 'system-images;android-[0-9]+;android-tv;x86_64' /tmp/sdk-list.txt | sed -E 's/system-images;android-([0-9]+);android-tv;x86_64/\1/' | sort -nr | head -n1)"
          test -n "$API"
          echo "api=$API" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android TV install and startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tvimage.outputs.api }}
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am force-stop com.example.iptvplayer
            adb logcat -c
            adb shell am start -W -n com.example.iptvplayer/.MainActivity > /tmp/uxfix-start.txt
            grep -q 'Status: ok' /tmp/uxfix-start.txt
            sleep 12
            adb shell pidof com.example.iptvplayer > /tmp/uxfix-pid.txt
            grep -Eq '^[0-9]+' /tmp/uxfix-pid.txt
            adb logcat -d > /tmp/uxfix-logcat.txt
            python3 -c 'import pathlib,sys; p=pathlib.Path("/tmp/uxfix-logcat.txt").read_text(errors="ignore"); sys.exit(1 if ("FATAL EXCEPTION" in p and "Process: com.example.iptvplayer" in p) else 0)'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-UX-LTR-Live-Stability-Test-Evidence
          path: |
            /tmp/uxfix-apk.sha256
            /tmp/uxfix-start.txt
            /tmp/uxfix-pid.txt
            /tmp/uxfix-logcat.txt
            /tmp/brotv-uxfix/source/IPTVPlayer/app/build/reports/tests/testDebugUnitTest/
            /tmp/brotv-uxfix/source/IPTVPlayer/app/build/reports/lint-results-debug.html
            /tmp/brotv-uxfix/source/IPTVPlayer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
