name: BRO TV 1.1.1 Probe Cushion Client

on:
  push:
    branches: [ brotv-1.1.1-build ]
    paths:
      - '.github/workflows/brotv-1.1.1-probe-cushion-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cushion client logic
        run: |
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o client.js
          grep -aEio '.{0,500}cushionId.{0,900}' client.js | head -40 || true
