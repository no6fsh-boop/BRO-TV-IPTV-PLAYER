name: Validate BROTV Feature 02 Smart Quality Guard

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-feature02-smart-quality.yml'
  workflow_dispatch:

jobs:
  validate-feature02:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: 5hgi0ON1VnEb
      FILE_ID: 01a09dac8d3a75f58f9e265ef8e1794b
      EXPECTED_SIZE: '3622124'
      EXPECTED_SHA256: 9182ca5f6680db21189476da1c0767f4410828af51afc2bb97579e4fb56779f8
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact feature source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-feature02 && mkdir -p /tmp/brotv-feature02 && cd /tmp/brotv-feature02
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d)
              sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/feature02-apk.sha256
      - name: Detect available Android TV image
        id: tvimage
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > /tmp/sdk-list.txt
          API="$(grep -oE 'system-images;android-[0-9]+;android-tv;x86_64' /tmp/sdk-list.txt | sed -E 's/system-images;android-([0-9]+);android-tv;x86_64/\1/' | sort -nr | head -n1)"
          test -n "$API"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "Using Android TV API $API"
      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android TV install and startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tvimage.outputs.api }}
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am force-stop com.example.iptvplayer
            adb logcat -c
            adb shell am start -W -n com.example.iptvplayer/.MainActivity > /tmp/feature02-start.txt
            cat /tmp/feature02-start.txt
            grep -q 'Status: ok' /tmp/feature02-start.txt
            sleep 15
            adb shell pidof com.example.iptvplayer > /tmp/feature02-pid.txt
            grep -Eq '^[0-9]+' /tmp/feature02-pid.txt
            adb shell dumpsys activity activities > /tmp/feature02-activity.txt
            grep -q 'com.example.iptvplayer' /tmp/feature02-activity.txt
            adb logcat -d > /tmp/feature02-logcat.txt
            python3 -c 'import pathlib,sys; p=pathlib.Path("/tmp/feature02-logcat.txt").read_text(errors="ignore"); sys.exit(1 if ("FATAL EXCEPTION" in p and "Process: com.example.iptvplayer" in p) else 0)'
            cat /tmp/feature02-pid.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-Feature02-Test-Evidence
          path: |
            /tmp/feature02-apk.sha256
            /tmp/feature02-start.txt
            /tmp/feature02-pid.txt
            /tmp/feature02-activity.txt
            /tmp/feature02-logcat.txt
            /tmp/brotv-feature02/source/IPTVPlayer/app/build/reports/tests/testDebugUnitTest/
            /tmp/brotv-feature02/source/IPTVPlayer/app/build/reports/lint-results-debug.html
            /tmp/brotv-feature02/source/IPTVPlayer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
