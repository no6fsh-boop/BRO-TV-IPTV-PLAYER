name: BROTV+ v0.4 full Android TV test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brotvplus-v04-full-test.yml'

jobs:
  full-test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout test bundle
        uses: actions/checkout@v4

      - name: Reconstruct and verify BROTV+ v0.4 source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib
          parts = sorted(glob.glob('.github/brotvplus-v04/part*.b64'))
          assert len(parts) == 9, parts
          raw = base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts))
          out = pathlib.Path('/tmp/BROTV-plus-v04-source.zip')
          out.write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          print('source sha256:', digest)
          assert digest == 'a2a3cc0f3d0f59f697fd7508521746ca8e7d28ee34c73b230efa3a1066ff0488'
          PY
          rm -rf /tmp/brotv-project && mkdir /tmp/brotv-project
          unzip -q /tmp/BROTV-plus-v04-source.zip -d /tmp/brotv-project
          test -f /tmp/brotv-project/settings.gradle.kts
          echo 'PROJECT_DIR=/tmp/brotv-project' >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests and debug APK build
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/BROTV-PLUS-v04.apk
          find app/build/test-results/testDebugUnitTest -name '*.xml' -maxdepth 2 -print -exec cat {} \; > /tmp/unit-tests.txt

      - name: Verify APK TV metadata
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging /tmp/BROTV-PLUS-v04.apk | tee /tmp/apk-badging.txt
          grep -q "application-label:'BROTV+'" /tmp/apk-badging.txt
          grep -q "versionName='0.4.0-brotvplus'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'23'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity" /tmp/apk-badging.txt

      - name: Start synthetic IPTV provider
        shell: bash
        run: |
          cat > /tmp/fake_iptv.py <<'PY'
          import json, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse, parse_qs

          def js(obj): return json.dumps(obj, ensure_ascii=False).encode('utf-8')
          class H(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print('[IPTV]', fmt % args, flush=True)
              def send_json(self, obj):
                  b=js(obj); self.send_response(200); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  u=urlparse(self.path); q=parse_qs(u.query); action=q.get('action',[''])[0]
                  if u.path.endswith('/player_api.php') or u.path == '/player_api.php':
                      if not action:
                          return self.send_json({'user_info':{'auth':1,'status':'Active','exp_date':'1999999999','max_connections':'2'},'server_info':{'url':'10.0.2.2','port':'18080'}})
                      if action=='get_live_categories':
                          return self.send_json([{'category_id':'1','category_name':'رياضة'},{'category_id':'2','category_name':'نسخ احتياطية'}])
                      if action=='get_live_streams':
                          return self.send_json([
                            {'stream_id':101,'name':'beIN Sports 1 FHD','category_id':'1','stream_icon':'','epg_channel_id':'bein1','tv_archive':1,'tv_archive_duration':'3'},
                            {'stream_id':102,'name':'beIN Sports 1 HD BACKUP','category_id':'2','stream_icon':'','epg_channel_id':'bein1','tv_archive':1,'tv_archive_duration':'3'},
                            {'stream_id':103,'name':'Sports Test HD','category_id':'1','stream_icon':'','epg_channel_id':'sports-test','tv_archive':0,'tv_archive_duration':'0'}])
                      if action in ('get_simple_data_table','get_short_epg'):
                          now=int(time.time())
                          return self.send_json({'epg_listings':[
                            {'title':'VGVzdCBNYXRjaA==','description':'U3ludGhldGljIEVQRw==','start':'2026-09-11 10:00:00','end':'2026-09-11 11:00:00','start_timestamp':now-1800,'stop_timestamp':now+1800},
                            {'title':'TmV4dCBNYXRjaA==','description':'TmV4dA==','start':'2026-09-11 11:00:00','end':'2026-09-11 12:00:00','start_timestamp':now+1800,'stop_timestamp':now+5400}]})
                      if action=='get_vod_categories': return self.send_json([{'category_id':'10','category_name':'أفلام تجريبية'}])
                      if action=='get_vod_streams': return self.send_json([{'stream_id':201,'name':'Synthetic Movie','category_id':'10','stream_icon':'','rating':'8.1','year':'2026','genre':'Test','plot':'Synthetic movie for BROTV+ test','duration':'00:01:00','container_extension':'mp4','added':'1'}])
                      if action=='get_series_categories': return self.send_json([{'category_id':'20','category_name':'مسلسلات تجريبية'}])
                      if action=='get_series': return self.send_json([{'series_id':301,'name':'Synthetic Series','category_id':'20','cover':'','rating':'8.5','year':'2026','genre':'Test','plot':'Synthetic series','last_modified':'1'}])
                      if action=='get_series_info': return self.send_json({'info':{'cover':'','rating':'8.5','year':'2026','genre':'Test','plot':'Synthetic series'},'episodes':{'1':[{'id':401,'episode_num':1,'title':'Episode 1','container_extension':'mp4','info':{'duration':'00:01:00','plot':'Synthetic episode','movie_image':''}}]}})
                      return self.send_json([])
                  if u.path.startswith('/live/') or u.path.startswith('/movie/') or u.path.startswith('/series/') or u.path.startswith('/timeshift/'):
                      data=b'BROTVPLUS_SYNTHETIC_STREAM'
                      self.send_response(200); self.send_header('Content-Type','video/mp2t'); self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data); return
                  self.send_response(404); self.end_headers()
          ThreadingHTTPServer(('0.0.0.0',18080),H).serve_forever()
          PY
          nohup python3 -u /tmp/fake_iptv.py >/tmp/fake-iptv.log 2>&1 &
          echo $! >/tmp/fake-iptv.pid
          sleep 1
          curl -fsS 'http://127.0.0.1:18080/player_api.php?username=test&password=test' | tee /tmp/fake-auth.json

      - name: Android TV emulator runtime and integration smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            adb install -r /tmp/BROTV-PLUS-v04.apk | tee /tmp/install.txt
            adb logcat -c
            adb shell am force-stop com.brotv.iptv
            adb shell monkey -p com.brotv.iptv -c android.intent.category.LEANBACK_LAUNCHER 1 | tee /tmp/launch.txt
            sleep 4
            adb shell pidof com.brotv.iptv | tee /tmp/pid.txt
            adb exec-out screencap -p > /tmp/01-login.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml /tmp/01-login.xml >/dev/null

            # Real TV remote path: initial field gets focus, text is typed, raw DPAD_CENTER advances focus.
            adb shell input text Synthetic
            adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell input text test
            adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell input text test
            adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell input text '10.0.2.2:18080'
            adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 5
            adb exec-out screencap -p > /tmp/02-home.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml /tmp/02-home.xml >/dev/null
            grep -q 'البث المباشر' /tmp/02-home.xml
            grep -q 'الأفلام' /tmp/02-home.xml
            grep -q 'المسلسلات' /tmp/02-home.xml

            cat > /tmp/tap_text.py <<'PY'
            import re,sys,subprocess,html
            wanted=sys.argv[1]
            subprocess.run('adb shell uiautomator dump /sdcard/ui.xml >/dev/null',shell=True,check=True)
            subprocess.run('adb pull /sdcard/ui.xml /tmp/current.xml >/dev/null',shell=True,check=True)
            s=open('/tmp/current.xml',encoding='utf-8').read()
            for node in re.findall(r'<node\b[^>]+>',s):
                m=re.search(r'text="([^"]*)"',node); b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
                if m and b and wanted in html.unescape(m.group(1)):
                    x=(int(b.group(1))+int(b.group(3)))//2; y=(int(b.group(2))+int(b.group(4)))//2
                    subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True); print(wanted,x,y); sys.exit(0)
            print('TEXT NOT FOUND:',wanted); print(s); sys.exit(2)
            PY

            python3 /tmp/tap_text.py 'الإعدادات'
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml /tmp/03-settings.xml >/dev/null
            grep -q 'لغة الواجهة' /tmp/03-settings.xml
            grep -q 'العربية' /tmp/03-settings.xml
            adb exec-out screencap -p > /tmp/03-settings.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2

            python3 /tmp/tap_text.py 'البث المباشر'
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml /tmp/04-live.xml >/dev/null
            grep -q 'رياضة' /tmp/04-live.xml
            grep -q 'beIN Sports 1' /tmp/04-live.xml
            grep -q '2 مصادر' /tmp/04-live.xml
            adb exec-out screencap -p > /tmp/04-live.png

            python3 /tmp/tap_text.py 'الأفلام'
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml /tmp/05-movies.xml >/dev/null
            grep -q 'Synthetic Movie' /tmp/05-movies.xml
            adb exec-out screencap -p > /tmp/05-movies.png

            python3 /tmp/tap_text.py 'المسلسلات'
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml /tmp/06-series.xml >/dev/null
            grep -q 'Synthetic Series' /tmp/06-series.xml
            adb exec-out screencap -p > /tmp/06-series.png

            python3 /tmp/tap_text.py 'إعادة البث'
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml /tmp/07-catchup.xml >/dev/null
            grep -q 'البرامج المتاحة' /tmp/07-catchup.xml
            grep -q 'Test Match' /tmp/07-catchup.xml
            adb exec-out screencap -p > /tmp/07-catchup.png

            # Exercise remote directions and Back without crashing.
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_LEFT
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell pidof com.brotv.iptv | tee /tmp/pid-after.txt
            adb logcat -d > /tmp/logcat.txt
            if grep -E 'FATAL EXCEPTION|ANR in com\.brotv\.iptv|Process: com\.brotv\.iptv.*has died' /tmp/logcat.txt; then
              echo 'BROTV+ crash/ANR detected' >&2; exit 1
            fi

      - name: Write full test report
        if: always()
        shell: bash
        run: |
          {
            echo '# BROTV+ v0.4 automated test report'
            echo
            echo '## Unit tests'
            grep -E 'testsuite|testcase|failure|error' /tmp/unit-tests.txt 2>/dev/null | head -n 80 || true
            echo
            echo '## APK metadata'
            head -n 20 /tmp/apk-badging.txt 2>/dev/null || true
            echo
            echo '## Emulator install/launch'
            cat /tmp/install.txt /tmp/launch.txt /tmp/pid.txt /tmp/pid-after.txt 2>/dev/null || true
            echo
            echo '## Synthetic provider requests'
            tail -n 100 /tmp/fake-iptv.log 2>/dev/null || true
            echo
            echo '## Crash/ANR scan'
            if grep -E 'FATAL EXCEPTION|ANR in com\.brotv\.iptv|Process: com\.brotv\.iptv.*has died' /tmp/logcat.txt 2>/dev/null; then true; else echo 'No BROTV+ fatal exception or ANR signature found.'; fi
          } > /tmp/BROTV-v04-TEST-REPORT.md
          cat /tmp/BROTV-v04-TEST-REPORT.md

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BROTV-plus-v04-full-test
          path: |
            /tmp/BROTV-PLUS-v04.apk
            /tmp/BROTV-v04-TEST-REPORT.md
            /tmp/unit-tests.txt
            /tmp/apk-badging.txt
            /tmp/fake-iptv.log
            /tmp/logcat.txt
            /tmp/01-login.png
            /tmp/02-home.png
            /tmp/03-settings.png
            /tmp/04-live.png
            /tmp/05-movies.png
            /tmp/06-series.png
            /tmp/07-catchup.png
            /tmp/01-login.xml
            /tmp/02-home.xml
            /tmp/03-settings.xml
            /tmp/04-live.xml
            /tmp/05-movies.xml
            /tmp/06-series.xml
            /tmp/07-catchup.xml
          if-no-files-found: ignore
          retention-days: 14
