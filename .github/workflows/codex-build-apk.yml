name: Build uploaded BRO TV project APK
on:
  push:
    branches: [codex/build-latest-dev15]
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK on the hosted runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Unpack the provided project
        run: |
          unzip -q build-source.zip -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/dev15/gradlew"
      - name: Build the existing debug variant
        working-directory: ${{ runner.temp }}/project/dev15
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bro-tv-latest-debug-apk
          path: ${{ runner.temp }}/project/dev15/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
