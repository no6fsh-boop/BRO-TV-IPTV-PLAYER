name: Import BRO PLUS TV v05 source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-brotvplus-v05.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify package
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path('.github/brotvplus-v05')
          names = [root/'part001.b64', root/'part002.b64', root/'part003.b64'] + [root/f'rest{i:03}.b64' for i in range(1, 7)]
          b64 = ''.join(p.read_text().strip() for p in names)
          raw = base64.b64decode(b64)
          got = hashlib.sha256(raw).hexdigest()
          expected = 'fad1aa3a66b23f9436d0356e3694c3965e29f7381daf80c7888c1b61fb728a6a'
          if got != expected:
              raise SystemExit(f'SHA256 mismatch: {got} != {expected}')
          pathlib.Path('/tmp/brotv.zip').write_bytes(raw)
          print(f'ZIP SHA256 verified: {got}')
          PY
          rm -rf /tmp/brotv
          mkdir -p /tmp/brotv
          unzip -q /tmp/brotv.zip -d /tmp/brotv
          rsync -a /tmp/brotv/BRO-PLUS-TV-FIXED/ ./
          rm -rf .github/brotvplus-v05
          rm -f .github/workflows/import-brotvplus-v05.yml

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import BRO PLUS TV Android TV-ready source"
          git push origin HEAD:main
