name: Android TV Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is unavailable on this runner"
          fi

      - name: Build debug, test, and release APKs
        run: gradle assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: GRADLE_CMD=gradle bash scripts/android_tv_smoke_test.sh

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bro-plus-tv-android-tv
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/tv-smoke/
