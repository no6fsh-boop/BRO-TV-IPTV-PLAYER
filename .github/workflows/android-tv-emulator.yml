name: Android TV Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu software -noaudio -no-boot-anim
          script: GRADLE_CMD=gradle bash scripts/android_tv_smoke_test.sh

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bro-plus-tv-android-tv
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            build/tv-smoke/
