name: Build BRO TV APK

on:
  push:
    branches: [main]
    paths:
      - 'BRO_TV_IPTV_PLAYER.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q BRO_TV_IPTV_PLAYER.zip -d project
          PROJECT_DIR="$(find project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          sed -i 's/compileSdk = 36/compileSdk = 37/' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew test :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BRO-TV-IPTV-PLAYER.apk
          sha256sum BRO-TV-IPTV-PLAYER.apk > BRO-TV-IPTV-PLAYER.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-IPTV-PLAYER-apk
          path: |
            BRO-TV-IPTV-PLAYER.apk
            BRO-TV-IPTV-PLAYER.apk.sha256
          retention-days: 30

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloader-latest
          name: BRO TV IPTV PLAYER - Downloader build
          prerelease: true
          make_latest: false
          files: |
            BRO-TV-IPTV-PLAYER.apk
            BRO-TV-IPTV-PLAYER.apk.sha256
