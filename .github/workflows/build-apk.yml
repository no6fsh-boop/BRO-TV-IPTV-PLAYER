name: Build BRO TV APK

on:
  push:
    branches: [main]
    paths:
      - 'BRO_TV_IPTV_PLAYER.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack and apply build compatibility fixes
        run: |
          rm -rf project
          mkdir project
          unzip -q BRO_TV_IPTV_PLAYER.zip -d project
          PROJECT_DIR="$(find project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/androidx.compose:compose-bom:2026.08.00/androidx.compose:compose-bom:2025.08.00/' "$APP_GRADLE"
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' "$APP_GRADLE"
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4/' "$APP_GRADLE"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.9.4/' "$APP_GRADLE"
          sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/' "$APP_GRADLE"

          PLAYER_ENGINE="$PROJECT_DIR/app/src/main/java/com/brotv/iptvplayer/player/PlayerEngine.kt"
          sed -i 's/minBufferMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/maxBufferMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/bufferForPlaybackMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/bufferForPlaybackAfterRebufferMs = when/when/' "$PLAYER_ENGINE"

          PLAYER_SCREEN="$PROJECT_DIR/app/src/main/java/com/brotv/iptvplayer/ui/screens/PlayerScreen.kt"
          sed -i '/import androidx.compose.ui.input.key.nativeKeyEvent/d' "$PLAYER_SCREEN"
          sed -i 's/key\.nativeKeyEvent\.repeatCount/key.repeatCount/g' "$PLAYER_SCREEN"
          sed -i 's/key\.nativeKeyEvent\.keyCode/key.keyCode/g' "$PLAYER_SCREEN"

          echo '--- Effective app/build.gradle.kts ---'
          cat "$APP_GRADLE"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew test :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BRO-TV-IPTV-PLAYER.apk
          sha256sum BRO-TV-IPTV-PLAYER.apk > BRO-TV-IPTV-PLAYER.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-IPTV-PLAYER-apk
          path: |
            BRO-TV-IPTV-PLAYER.apk
            BRO-TV-IPTV-PLAYER.apk.sha256
          retention-days: 30

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloader-latest
          name: BRO TV IPTV PLAYER - Downloader build
          prerelease: true
          make_latest: false
          files: |
            BRO-TV-IPTV-PLAYER.apk
            BRO-TV-IPTV-PLAYER.apk.sha256
