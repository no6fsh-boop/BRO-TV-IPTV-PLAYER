name: Apply Live TV Player Thread Fix

on:
  push:
    branches:
      - qa/full-e2e
    paths:
      - '.github/workflows/apply-live-player-thread-fix.yml'
      - 'scripts/apply_live_player_thread_fix.py'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-e2e
      - name: Patch LiveTvScreen
        run: python3 scripts/apply_live_player_thread_fix.py
      - name: Commit source fix
        run: |
          if git diff --quiet -- app/src/main/java/com/brotv/iptv/ui/screens/live/LiveTvScreen.kt; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/brotv/iptv/ui/screens/live/LiveTvScreen.kt
          git commit -m "Fix Live TV ExoPlayer thread access"
          git push origin HEAD:qa/full-e2e
