name: Validate BROTV Feature 01 XMLTV

on:
  push:
    branches:
      - review/brotv-fixed-source-20260914
    paths:
      - '.github/workflows/validate-feature01-xmltv.yml'
  workflow_dispatch:

jobs:
  validate-feature01:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: 1aRVIwy-y72z
      FILE_ID: 01a09da31d8b7449b49187241787e591
      EXPECTED_SIZE: '3617726'
      EXPECTED_SHA256: 5318f949e5e037fdfb9de11785317d723c66e696fa7d87ef7135f9b569b2f0b1
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download exact feature source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brotv-feature01 && mkdir -p /tmp/brotv-feature01 && cd /tmp/brotv-feature01
          curl -fsSL -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" -o download.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          d=json.loads(pathlib.Path('download.json').read_text())
          url=d.get('downloadUrl')
          if not url:
              print(d)
              sys.exit(3)
          subprocess.run(['curl','-fL','--retry','3',url,'-o','source.zip'],check=True)
          PY
          test "$(stat -c%s source.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q 'applicationId = "com.example.iptvplayer"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:lintDebug
