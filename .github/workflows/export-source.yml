name: Export BRO TV source ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct BRO TV v0.4.0 source
        run: |
          rm -rf project
          mkdir project
          unzip -q BRO_TV_IPTV_PLAYER.zip -d project
          PROJECT_DIR="$(find project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"

          cat .github/patches/v0.3.0.part* | base64 -d | gunzip > /tmp/brotv-v0.3.0.patch
          (
            cd "$PROJECT_DIR"
            patch -p1 < /tmp/brotv-v0.3.0.patch
          )

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/androidx.compose:compose-bom:2026.08.00/androidx.compose:compose-bom:2025.08.00/' "$APP_GRADLE"
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' "$APP_GRADLE"
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4/' "$APP_GRADLE"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.9.4/' "$APP_GRADLE"
          sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/' "$APP_GRADLE"

          PLAYER_ENGINE="$PROJECT_DIR/app/src/main/java/com/brotv/iptvplayer/player/PlayerEngine.kt"
          sed -i 's/minBufferMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/maxBufferMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/bufferForPlaybackMs = when/when/' "$PLAYER_ENGINE"
          sed -i 's/bufferForPlaybackAfterRebufferMs = when/when/' "$PLAYER_ENGINE"

          PLAYER_SCREEN="$PROJECT_DIR/app/src/main/java/com/brotv/iptvplayer/ui/screens/PlayerScreen.kt"
          sed -i '/import androidx.compose.ui.input.key.nativeKeyEvent/d' "$PLAYER_SCREEN"

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          files = [
              root / "app/src/main/java/com/brotv/iptvplayer/ui/screens/CategoryVisibilityScreen.kt",
              root / "app/src/main/java/com/brotv/iptvplayer/ui/screens/LiveTvScreen.kt",
              root / "app/src/main/java/com/brotv/iptvplayer/ui/screens/SettingsScreen.kt",
          ]
          replacements = {
              'Border(BorderStroke(1.dp, if (isHidden) BroRed.copy(.55f) else Color(0xFF36383D)), RoundedCornerShape(9.dp))': 'Border(BorderStroke(1.dp, if (isHidden) BroRed.copy(.55f) else Color(0xFF36383D)))',
              'Border(BorderStroke(3.dp, BroRed), RoundedCornerShape(9.dp))': 'Border(BorderStroke(3.dp, BroRed))',
              'Border(BorderStroke(1.dp, Color(0xFF34363B)), RoundedCornerShape(8.dp))': 'Border(BorderStroke(1.dp, Color(0xFF34363B)))',
              'Border(BorderStroke(3.dp, BroRed), RoundedCornerShape(8.dp))': 'Border(BorderStroke(3.dp, BroRed))',
              'Border(BorderStroke(1.dp, if (smart) BroRed.copy(.32f) else Color(0xFF34363B)), RoundedCornerShape(8.dp))': 'Border(BorderStroke(1.dp, if (smart) BroRed.copy(.32f) else Color(0xFF34363B)))',
              'Border(BorderStroke(2.dp, BroRed), RoundedCornerShape(8.dp))': 'Border(BorderStroke(2.dp, BroRed))',
              'Border(BorderStroke(1.dp, if (active) BroRed.copy(.55f) else Color(0xFF3A3B40)), RoundedCornerShape(12.dp))': 'Border(BorderStroke(1.dp, if (active) BroRed.copy(.55f) else Color(0xFF3A3B40)))',
              'Border(BorderStroke(3.dp, BroRed), RoundedCornerShape(12.dp))': 'Border(BorderStroke(3.dp, BroRed))',
          }
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat .github/patches/v0.4.0.valid.part* | base64 -d | gunzip > /tmp/brotv-v0.4.0.patch
          (
            cd "$PROJECT_DIR"
            patch -p1 < /tmp/brotv-v0.4.0.patch
          )

          base64 -d .github/patches/v0.4.0.provider-hotfix.b64 | gunzip > /tmp/brotv-v0.4.0-provider-hotfix.patch
          (
            cd "$PROJECT_DIR"
            patch -p1 < /tmp/brotv-v0.4.0-provider-hotfix.patch
          )

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/BRO-TV-IPTV-PLAYER-v0.4.0-source.zip" .

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-v0.4.0-source
          path: BRO-TV-IPTV-PLAYER-v0.4.0-source.zip
          retention-days: 7
          if-no-files-found: error
