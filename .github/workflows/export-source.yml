name: Export BRO TV source ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BRO-TV-source-base
          path: BRO-TV-IPTV-PLAYER.zip
          retention-days: 7
