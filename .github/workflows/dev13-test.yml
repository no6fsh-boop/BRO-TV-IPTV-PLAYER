name: Dev13 Transfer Diagnostic
on:
  push:
    branches: [ dev13-test ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Firestorage API
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          page='/tmp/page.html'
          curl -L --fail -o "$page" "$base/ja/f/t3Ag-0CjC8pD"
          grep -oE 'src="[^"]+\.js"' "$page" | cut -d'"' -f2 > /tmp/scripts.txt
          cat /tmp/scripts.txt
          while read -r s; do
            curl -L --fail -s "$base$s" >> /tmp/all.js || true
            echo >> /tmp/all.js
          done < /tmp/scripts.txt
          echo '=== API/endpoint candidates ==='
          grep -oE '.{0,160}(api|download|share|fileId|publicId|token).{0,260}' /tmp/all.js | head -300 || true
          echo '=== URLs ==='
          grep -oE 'https?://[^"'\'' ]+' /tmp/all.js | sort -u | head -200 || true
          exit 1
