name: Dev13 Android TV Test
on:
  push:
    branches: [ dev13-test ]
  workflow_dispatch:
jobs:
  dev13:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Dev13 source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='t3Ag-0CjC8pD'
          curl --fail -sS "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/meta.json
          cat /tmp/meta.json
          python3 - <<'PY' > /tmp/fileid
          import json
          d=json.load(open('/tmp/meta.json'))
          files=d.get('files',[])
          assert files, 'No files in Dev13 share'
          print(files[0]['fileId'])
          PY
          FILEID="$(cat /tmp/fileid)"
          curl --fail -sS -X POST "$API/shares/$SHARE/files/$FILEID/download" -o /tmp/dl.json
          cat /tmp/dl.json
          python3 - <<'PY' > /tmp/url
          import json
          d=json.load(open('/tmp/dl.json'))
          assert d.get('downloadUrl'), 'No downloadUrl'
          print(d['downloadUrl'])
          PY
          curl -L --fail --retry 3 -o /tmp/dev13.zip "$(cat /tmp/url)"
          unzip -t /tmp/dev13.zip
          rm -rf /tmp/dev13 && mkdir /tmp/dev13
          unzip -q /tmp/dev13.zip -d /tmp/dev13
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/dev13/ ./
          grep -R "applicationId" app/build.gradle* || true
          grep -R "versionName" app/build.gradle* || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -x /usr/local/lib/android/sdk/platform-tools/adb
          /usr/local/lib/android/sdk/platform-tools/adb version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Android TV smoke and stress
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.brotv.player -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell monkey -p com.brotv.player --throttle 100 500
            adb shell dumpsys activity processes | grep -i com.brotv.player || true
            adb logcat -d '*:E' > android-tv-errors.log
      - name: Upload Dev13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev13-test-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            android-tv-errors.log
