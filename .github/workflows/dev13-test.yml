name: Dev15 Android TV Multi-Source QA
on:
  push:
    branches:
      - dev13-test
  workflow_dispatch: {}
jobs:
  live-multisource:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dev15 v17 source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='_NZ_KWIyJuxb'
          curl --fail -sS "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/meta.json
          python3 - <<'PY' > /tmp/fileid
          import json
          d=json.load(open('/tmp/meta.json'))
          files=d.get('files',[])
          assert files, 'No source files in share'
          print(files[0]['fileId'])
          PY
          FILEID="$(cat /tmp/fileid)"
          curl --fail -sS -X POST "$API/shares/$SHARE/files/$FILEID/download" -o /tmp/dl.json
          python3 - <<'PY' > /tmp/url
          import json
          d=json.load(open('/tmp/dl.json'))
          assert d.get('downloadUrl'), 'No source downloadUrl'
          print(d['downloadUrl'])
          PY
          curl -L --fail --retry 3 -o /tmp/dev15.zip "$(cat /tmp/url)"
          unzip -t /tmp/dev15.zip
          rm -rf /tmp/dev15 && mkdir /tmp/dev15
          unzip -q /tmp/dev15.zip -d /tmp/dev15
          SRC="$(find /tmp/dev15 -maxdepth 2 -type d -name app -print -quit | xargs -r dirname)"
          test -n "$SRC"
          rsync -a --delete --exclude='.git' --exclude='.github' "$SRC/" ./

      - name: Fetch already-verified v15 APK
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='NkBknIv4qurx'
          curl --fail -sS "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/apkmeta.json
          python3 - <<'PY' > /tmp/apkfileid
          import json
          d=json.load(open('/tmp/apkmeta.json'))
          files=d.get('files',[])
          assert files, 'No APK in share'
          print(files[0]['fileId'])
          PY
          FILEID="$(cat /tmp/apkfileid)"
          curl --fail -sS -X POST "$API/shares/$SHARE/files/$FILEID/download" -o /tmp/apkdl.json
          python3 - <<'PY' > /tmp/apkurl
          import json
          d=json.load(open('/tmp/apkdl.json'))
          assert d.get('downloadUrl'), 'No APK downloadUrl'
          print(d['downloadUrl'])
          PY
          curl -L --fail --retry 3 -o /tmp/app-debug.apk "$(cat /tmp/apkurl)"
          test -s /tmp/app-debug.apk
          unzip -t /tmp/app-debug.apk >/dev/null

      - name: Multi-source QA sanity
        run: |
          python3 -m py_compile ci/adb_ui.py ci/mock_xtream_server.py
          bash -n ci/android_tv_qa_multisource.sh

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Android TV manual source switching QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: BROTV_QA_APK=/tmp/app-debug.apk bash ci/android_tv_qa_multisource.sh

      - name: Upload multi-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev15-multisource-evidence
          path: |
            brotv-multisource-dialog.png
            brotv-multisource-selected.png
            multisource-after-select.xml
            multisource-after-select-activity.txt
            multisource-after-back1.txt
            multisource-after-back2.txt
            focus-multisource.txt
            android-tv-errors-multisource.log
            mock-xtream-multisource.log
            mock-account-multisource.json
