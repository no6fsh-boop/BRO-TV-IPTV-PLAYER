name: Dev15 Android TV Test
on:
  push:
    branches:
      - dev13-test
  workflow_dispatch: {}
jobs:
  dev15:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Dev15 source
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='2mNDTWvPsefb'
          curl --fail -sS "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/meta.json
          python3 - <<'PY' > /tmp/fileid
          import json
          d=json.load(open('/tmp/meta.json'))
          files=d.get('files',[])
          assert files, 'No files in Dev15 share'
          print(files[0]['fileId'])
          PY
          FILEID="$(cat /tmp/fileid)"
          curl --fail -sS -X POST "$API/shares/$SHARE/files/$FILEID/download" -o /tmp/dl.json
          python3 - <<'PY' > /tmp/url
          import json
          d=json.load(open('/tmp/dl.json'))
          assert d.get('downloadUrl'), 'No downloadUrl'
          print(d['downloadUrl'])
          PY
          curl -L --fail --retry 3 -o /tmp/dev15.zip "$(cat /tmp/url)"
          unzip -t /tmp/dev15.zip
          rm -rf /tmp/dev15 && mkdir /tmp/dev15
          unzip -q /tmp/dev15.zip -d /tmp/dev15
          SRC="$(find /tmp/dev15 -maxdepth 2 -type d -name app -print -quit | xargs -r dirname)"
          test -n "$SRC"
          test -d "$SRC/app"
          rsync -a --delete --exclude='.git' --exclude='.github' "$SRC/" ./
          grep -R "versionName" app/build.gradle* || true

      - name: Package fetched Dev15 source snapshot
        shell: bash
        run: |
          zip -qr /tmp/dev15-source-snapshot.zip . -x '.git/*' '.github/*' '.gradle/*' 'app/build/*'

      - name: Upload Dev15 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dev15-source-snapshot
          path: /tmp/dev15-source-snapshot.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Android TV full mock-provider QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/android_tv_qa.sh

      - name: Upload Dev15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev15-test-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            android-tv-errors.log
            gfxinfo.txt
            meminfo.txt
            brotv-login-before.png
            brotv-login-after-nav.png
            brotv-home-mock.png
            brotv-movies-mock.png
            brotv-movies-after-nav.png
            brotv-movie-player-mock.png
            brotv-series-mock.png
            brotv-series-after-open.png
            activity-series-open.txt
            activity-after-episode-back.txt
            brotv-series-detail-mock.png
            brotv-episode-player-mock.png
            brotv-settings-mock.png
            brotv-live-mock.png
            focus-login.txt
            focus-final.txt
            gfxinfo-movies.txt
            mock-xtream.log
            mock-account.json
