name: Dev13 Android TV Test
on:
  push:
    branches: [ dev13-test ]
  workflow_dispatch:
jobs:
  dev13:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Dev13 source package
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
import urllib.request,re,html,json
share='https://firestorage.ai/ja/f/t3Ag-0CjC8pD'
s=urllib.request.urlopen(share).read().decode('utf-8','ignore')
print(s)
PY
exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Android TV smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell monkey -p com.example.iptvplayer -c android.intent.category.LAUNCHER 1 && sleep 8
      - name: Upload Dev13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev13-test-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
